<title>RAID Log Tracker</title>
<style>
  /* ============ TOKENS ============ */
  :root{
    color-scheme: light;
    --bg: #f6f6f3;
    --plane: #f1f1ed;
    --surface: #ffffff;
    --surface-2: #eef0ea;
    --border: rgba(20,26,38,0.11);
    --border-strong: rgba(20,26,38,0.18);
    --text-primary: #14181f;
    --text-secondary: #565f6d;
    --text-muted: #8a92a0;
    --ink-on-accent: #ffffff;

    --accent: #1e3a5f;         /* deep ledger navy - nav / structural accent */
    --accent-strong: #142845;
    --accent-soft: rgba(30,58,95,0.08);
    --sidebar-bg: #142845;     /* fixed dark navy chrome - deliberately does not invert with theme */
    --action: #a8631f;         /* brass - primary call to action only */
    --action-strong: #8a4f16;
    --action-soft: rgba(168,99,31,0.12);

    /* RAID type identity (categorical, fixed order - never reassign) */
    --type-risk: #2a78d6;
    --type-assumption: #eb6834;
    --type-issue: #1baf7a;
    --type-dependency: #c98d00;

    /* status / severity (fixed, never themed) */
    --sev-critical: #d03b3b;
    --sev-high: #ec835a;
    --sev-medium: #d3900f;
    --sev-low: #0ca30c;

    --shadow-soft: 0 1px 2px rgba(20,26,38,0.06), 0 8px 24px -12px rgba(20,26,38,0.18);
    --shadow-modal: 0 24px 64px -16px rgba(10,14,20,0.35);
    --radius-s: 6px;
    --radius-m: 10px;
    --radius-l: 16px;
    --font-display: "Libre Franklin", system-ui, sans-serif;
    --font-body: "Source Sans 3", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg: #101318;
      --plane: #0c0e12;
      --surface: #171b21;
      --surface-2: #1d222a;
      --border: rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.18);
      --text-primary: #f0f2f5;
      --text-secondary: #b7bec9;
      --text-muted: #7c8492;
      --ink-on-accent: #ffffff;

      --accent: #7fa1cf;
      --accent-strong: #a9c3e3;
      --accent-soft: rgba(127,161,207,0.14);
      --action: #d9a24d;
      --action-strong: #ecb968;
      --action-soft: rgba(217,162,77,0.16);

      --type-risk: #3987e5;
      --type-assumption: #d95926;
      --type-issue: #199e70;
      --type-dependency: #c98500;

      --sev-critical: #e66767;
      --sev-high: #ec835a;
      --sev-medium: #e0a838;
      --sev-low: #0ca30c;

      --shadow-soft: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -12px rgba(0,0,0,0.5);
      --shadow-modal: 0 24px 64px -16px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg: #101318;
    --plane: #0c0e12;
    --surface: #171b21;
    --surface-2: #1d222a;
    --border: rgba(255,255,255,0.10);
    --border-strong: rgba(255,255,255,0.18);
    --text-primary: #f0f2f5;
    --text-secondary: #b7bec9;
    --text-muted: #7c8492;
    --ink-on-accent: #ffffff;

    --accent: #7fa1cf;
    --accent-strong: #a9c3e3;
    --accent-soft: rgba(127,161,207,0.14);
    --action: #d9a24d;
    --action-strong: #ecb968;
    --action-soft: rgba(217,162,77,0.16);

    --type-risk: #3987e5;
    --type-assumption: #d95926;
    --type-issue: #199e70;
    --type-dependency: #c98500;

    --sev-critical: #e66767;
    --sev-high: #ec835a;
    --sev-medium: #e0a838;
    --sev-low: #0ca30c;

    --shadow-soft: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -12px rgba(0,0,0,0.5);
    --shadow-modal: 0 24px 64px -16px rgba(0,0,0,0.6);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,h4{ font-family: var(--font-display); margin:0; text-wrap: balance; letter-spacing: -0.01em; }
  button, input, select, textarea{ font-family: inherit; font-size: inherit; color: inherit; }
  button{ cursor:pointer; }
  ::selection{ background: var(--accent-soft); }
  a{ color: inherit; }
  .mono{ font-family: var(--font-mono); }
  .tabular{ font-variant-numeric: tabular-nums; }

  /* focus */
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  /* ============ APP SHELL ============ */
  #app{ display:flex; min-height:100vh; }

  .sidebar{
    width: 236px; flex: none;
    background: var(--sidebar-bg);
    color: #eef1f6;
    display:flex; flex-direction:column;
    position: sticky; top:0; height:100vh;
    z-index: 20;
  }
  .sidebar-brand{
    display:flex; align-items:center; gap:10px;
    padding: 20px 18px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }
  .brand-mark{
    width:30px; height:30px; border-radius: 7px;
    background: var(--action);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-mono); font-weight:700; font-size:13px; color:#241300;
    flex: none;
  }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; }
  .brand-text strong{ font-family: var(--font-display); font-size:15.5px; font-weight:700; letter-spacing:-0.01em; }
  .brand-text span{ font-size:10.5px; color: rgba(238,241,246,0.6); letter-spacing:.06em; text-transform:uppercase; }

  .nav-group-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.08em;
    color: rgba(238,241,246,0.45); padding: 16px 18px 6px;
  }
  .nav{ list-style:none; margin:0; padding: 4px 10px; display:flex; flex-direction:column; gap:2px; }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding: 8px 10px; border-radius: 8px;
    color: rgba(238,241,246,0.78);
    font-size: 13.5px; font-weight:600;
    border:none; background:transparent; width:100%; text-align:left;
  }
  .nav-item:hover{ background: rgba(255,255,255,0.08); color:#fff; }
  .nav-item.active{ background: rgba(255,255,255,0.14); color:#fff; }
  .nav-item .dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .nav-item .icon{ width:16px; height:16px; flex:none; display:flex; align-items:center; justify-content:center; }
  .nav-item .count{ margin-left:auto; font-size:11px; font-family: var(--font-mono); color: rgba(238,241,246,0.55); }

  .sidebar-foot{
    margin-top:auto; padding: 14px 18px; border-top:1px solid rgba(255,255,255,0.12);
    font-size:11.5px; color: rgba(238,241,246,0.5);
  }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }

  .topbar{
    position: sticky; top:0; z-index:15;
    display:flex; align-items:center; gap:14px;
    padding: 12px 24px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    min-height: 60px;
  }
  .topbar h1{ font-size: 18px; font-weight:700; }
  .topbar .subtitle{ font-size:12px; color:var(--text-secondary); margin-top:1px; }
  .search-global{
    display:flex; align-items:center; gap:8px;
    background: var(--surface-2); border:1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; width: 300px; max-width: 40vw;
    color: var(--text-secondary);
  }
  .search-global input{ border:none; background:transparent; outline:none; width:100%; color:var(--text-primary); }
  .topbar-actions{ margin-left:auto; display:flex; align-items:center; gap:10px; }
  .menu-toggle{ display:none; }

  /* ============ SYNC STATUS BADGE (Data Service / Google Sheets) ============ */
  .sync-badge{
    display:flex; align-items:center; gap:9px; border:1px solid var(--border); background:var(--surface-2);
    border-radius:99px; padding:5px 6px 5px 12px; cursor:pointer; max-width: 280px;
  }
  .sync-badge .dot{ width:8px; height:8px; border-radius:50%; flex:none; background:var(--text-muted); }
  .sync-badge.sync-ok .dot{ background: var(--sev-low); }
  .sync-badge.sync-busy .dot{ background: var(--sev-medium); animation: sync-pulse 1s ease-in-out infinite; }
  .sync-badge.sync-off .dot{ background: var(--text-muted); }
  .sync-badge.sync-err .dot{ background: var(--sev-critical); }
  @keyframes sync-pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
  .sync-text{ display:flex; flex-direction:column; line-height:1.25; overflow:hidden; }
  .sync-text strong{ font-size:12px; }
  .sync-text .sync-sub{ font-size:10.5px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sync-badge .sync-now-btn{
    width:26px; height:26px; padding:0; display:inline-flex; align-items:center; justify-content:center;
    border-radius:50%; border:none; background:transparent; color:var(--text-secondary); font-size:14px; cursor:pointer;
  }
  .sync-badge .sync-now-btn:hover{ background: var(--surface); }
  @media (max-width: 780px){ .sync-badge .sync-sub{ display:none; } }

  /* ============ SETTINGS: DATA SOURCE PANEL ============ */
  .data-source-modes{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .data-source-mode-card{
    flex:1 1 170px; border:1px solid var(--border); border-radius: var(--radius-l); padding:12px 14px;
    cursor:pointer; background:var(--surface);
  }
  .data-source-mode-card.active{ border-color:var(--accent); background: var(--accent-soft); }
  .data-source-mode-card .name{ font-weight:700; font-size:13px; }
  .data-source-mode-card .desc{ font-size:11.5px; color:var(--text-muted); margin-top:3px; }
  .data-source-status-row{ display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .data-source-status-row:last-of-type{ border-bottom:none; }
  .data-source-status-row .k{ color:var(--text-muted); }
  .data-source-status-row .v{ font-weight:600; text-align:right; }
  .ds-sheet-url-input{
    flex:1 1 260px; min-width:200px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:8px; padding:8px 10px; color:var(--text-primary); font-size:13px;
  }

  .content{ padding: 22px 24px 60px; max-width: 1400px; width:100%; margin: 0 auto; }

  /* ============ BUTTONS ============ */
  .btn{
    display:inline-flex; align-items:center; gap:7px;
    padding: 8px 14px; border-radius: 8px; border:1px solid transparent;
    font-weight:600; font-size:13px; white-space:nowrap;
    background: var(--surface-2); color: var(--text-primary); border-color: var(--border);
    transition: background .12s ease, border-color .12s ease, transform .05s ease;
  }
  .btn:hover{ border-color: var(--border-strong); }
  .btn:active{ transform: translateY(1px); }
  .btn-primary{ background: var(--action); color: #241300; border-color: transparent; }
  .btn-primary:hover{ background: var(--action-strong); }
  :root[data-theme="dark"] .btn-primary, .btn-primary{ color:#241300; }
  .btn-ghost{ background: transparent; border-color: transparent; }
  .btn-ghost:hover{ background: var(--surface-2); }
  .btn-danger{ background: transparent; color: var(--sev-critical); border-color: var(--border); }
  .btn-danger:hover{ background: rgba(208,59,59,0.10); border-color: var(--sev-critical); }
  .btn-sm{ padding: 5px 10px; font-size:12px; border-radius:6px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .icon-btn{
    width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center;
    border-radius:7px; border:1px solid var(--border); background:var(--surface-2);
  }
  .icon-btn:hover{ border-color: var(--border-strong); }

  /* ============ CARDS / SECTIONS ============ */
  .panel{
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-l);
  }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .section-head h2{ font-size:15px; }
  .section-head .hint{ font-size:12px; color: var(--text-muted); }

  /* KPI row — flexbox rather than grid: with a variable, sometimes-odd tile
     count (7 on the main dashboard, 4 on Actions panels), a grid with
     auto-fit columns leaves a colored dead track when the last row doesn't
     divide evenly. Flex-wrap just lets the trailing tile(s) grow to fill
     the row instead. */
  .kpi-row{
    display:flex; flex-wrap:wrap;
    gap:1px; background: var(--border);
    border:1px solid var(--border); border-radius: var(--radius-l); overflow:hidden;
    margin-bottom: 22px;
  }
  .kpi{
    background: var(--surface); padding: 16px 18px; display:flex; flex-direction:column; gap:6px;
    min-height: 92px; flex: 1 1 148px; min-width: 148px;
  }
  .kpi .label{ font-size:11.5px; color: var(--text-muted); text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
  .kpi .value{ font-family: var(--font-display); font-size: 26px; font-weight:700; font-variant-numeric: tabular-nums; }
  .kpi .value.crit{ color: var(--sev-critical); }
  .kpi .value.warn{ color: var(--sev-high); }
  .kpi .sub{ font-size:11.5px; color: var(--text-secondary); }

  .grid-2{ display:grid; grid-template-columns: 1.3fr 1fr; gap:16px; }
  .grid-2 > *{ min-width:0; } /* prevent a wide child (e.g. a data table) from blowing out the grid track */
  .grid-3{ display:grid; grid-template-columns: repeat(3,1fr); gap:16px; }
  .grid-3 > *{ min-width:0; }
  .chart-card{ padding: 16px 18px 18px; }
  .chart-card h3{ font-size:13px; margin-bottom:2px; }
  .chart-card .chart-hint{ font-size:11.5px; color:var(--text-muted); margin-bottom:12px; display:block; }

  .legend{ display:flex; flex-wrap:wrap; gap:10px 16px; margin-top:10px; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-secondary); }
  .legend-swatch{ width:9px; height:9px; border-radius:2px; flex:none; }
  .risk-band-legend{ margin-top:0; }

  /* Risk matrix (probability x impact heatmap) */
  .risk-matrix-wrap{ overflow-x:auto; }
  table.risk-matrix{ border-collapse:separate; border-spacing:4px; margin:0 auto; }
  table.risk-matrix th{ font-weight:600; color:var(--text-secondary); font-size:11px; text-align:center; padding:4px 6px; }
  table.risk-matrix .rm-axis-label{ font-size:9px; color:var(--text-muted); font-weight:400; }
  table.risk-matrix .rm-corner{ font-size:10px; color:var(--text-muted); text-align:right; vertical-align:bottom; line-height:1.5; }
  table.risk-matrix .rm-corner span{ display:block; }
  table.risk-matrix .rm-corner-sub{ text-align:left; }
  table.risk-matrix .rm-row-head{ text-align:right; padding-right:10px; }
  td.rm-cell{
    width:64px; height:52px; min-width:64px; border-radius:8px; border:1px solid var(--border);
    text-align:center; vertical-align:middle; transition: transform .1s ease, box-shadow .1s ease;
  }
  td.rm-cell.has-items{ cursor:pointer; border-color: var(--border-strong); }
  td.rm-cell.has-items:hover{ transform: translateY(-2px); box-shadow: var(--shadow-soft); }
  td.rm-cell .rm-score{ font-family: var(--font-mono); font-weight:700; font-size:14px; color:var(--text-primary); }
  td.rm-cell .rm-count{ font-size:10px; color:var(--text-secondary); font-weight:600; margin-top:1px; }
  @media (max-width: 640px){
    td.rm-cell{ width:44px; min-width:44px; height:40px; }
    td.rm-cell .rm-score{ font-size:12px; }
    td.rm-cell .rm-count{ font-size:8.5px; }
    table.risk-matrix .rm-axis-label{ display:none; }
  }

  .bar-row{ display:flex; align-items:center; gap:10px; padding:5px 0; }
  .bar-row .bar-label{ width: 108px; flex:none; font-size:12px; color:var(--text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track{ flex:1; height:10px; background: var(--surface-2); border-radius:4px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:4px; }
  .bar-row .bar-val{ width:26px; text-align:right; font-size:12px; color:var(--text-secondary); font-variant-numeric:tabular-nums; }

  .due-list{ display:flex; flex-direction:column; }
  .due-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed var(--border); }
  .due-row:last-child{ border-bottom:none; }
  .due-row .id{ font-family:var(--font-mono); font-size:11px; color:var(--text-muted); width:68px; flex:none; }
  .due-row .title{ flex:1; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .due-row .when{ font-size:11.5px; font-variant-numeric:tabular-nums; flex:none; }
  .due-row .when.overdue{ color: var(--sev-critical); font-weight:700; }
  .due-row .when.soon{ color: var(--sev-high); font-weight:600; }

  /* Badges / pills */
  .pill{
    display:inline-flex; align-items:center; gap:5px; padding: 2px 9px; border-radius: 99px;
    font-size:11.5px; font-weight:700; letter-spacing:.01em; white-space:nowrap; line-height:1.7;
  }
  .pill-dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .pill-type-risk{ background: color-mix(in srgb, var(--type-risk) 16%, transparent); color: var(--type-risk); }
  .pill-type-assumption{ background: color-mix(in srgb, var(--type-assumption) 16%, transparent); color: var(--type-assumption); }
  .pill-type-issue{ background: color-mix(in srgb, var(--type-issue) 18%, transparent); color: var(--type-issue); }
  .pill-type-dependency{ background: color-mix(in srgb, var(--type-dependency) 18%, transparent); color: var(--type-dependency); }

  .pill-sev-critical{ background: color-mix(in srgb, var(--sev-critical) 16%, transparent); color: var(--sev-critical); }
  .pill-sev-high{ background: color-mix(in srgb, var(--sev-high) 18%, transparent); color: var(--sev-high); }
  .pill-sev-medium{ background: color-mix(in srgb, var(--sev-medium) 20%, transparent); color: var(--sev-medium); }
  .pill-sev-low{ background: color-mix(in srgb, var(--sev-low) 16%, transparent); color: var(--sev-low); }

  .status-chip{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--text-secondary);
  }
  .status-chip .dot{ width:7px; height:7px; border-radius:50%; }
  .st-open .dot, .st-inprogress .dot{ background: var(--sev-medium); }
  .st-monitoring .dot{ background: var(--type-risk); }
  .st-resolved .dot, .st-closed .dot, .st-accepted .dot{ background: var(--sev-low); }
  .st-rejected .dot{ background: var(--text-muted); }

  /* ============ REGISTER TOOLBAR ============ */
  .toolbar{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:14px;
  }
  .toolbar .search-box{
    display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border);
    border-radius:8px; padding:8px 12px; min-width:230px; flex:1 1 230px; max-width: 360px;
  }
  .toolbar .search-box input{ border:none; outline:none; background:transparent; width:100%; color:var(--text-primary); }
  .filter-select, select.filter-select{
    background: var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:7px 10px; color:var(--text-primary); min-width: 108px;
  }
  .toggle-chip{
    border:1px solid var(--border); background:var(--surface); padding:6px 12px; border-radius:99px; font-size:12.5px; font-weight:600; color:var(--text-secondary); cursor:pointer;
  }
  .toggle-chip.active{ background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); }
  :root[data-theme="dark"] .toggle-chip.active, .toggle-chip.active{ color: var(--accent); }

  .result-count{ font-size:12.5px; color: var(--text-muted); margin-left:auto; white-space:nowrap; }
  .result-count strong{ color: var(--text-primary); font-weight:700; }

  /* ---- active filter chips (removable) ---- */
  .active-filters{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin: -2px 0 14px; }
  .active-filters-label{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color: var(--text-muted); }
  .filter-chip{
    display:inline-flex; align-items:center; gap:7px; background: var(--accent-soft); border:1px solid var(--accent);
    color: var(--accent-strong); border-radius:99px; padding:5px 6px 5px 12px; font-size:12px; font-weight:600; line-height:1.3;
  }
  :root[data-theme="dark"] .filter-chip, .filter-chip{ color: var(--accent); }
  .filter-chip button{
    border:none; background: color-mix(in srgb, currentColor 14%, transparent); color:inherit; width:17px; height:17px;
    border-radius:50%; cursor:pointer; font-size:10px; line-height:1; display:inline-flex; align-items:center; justify-content:center; padding:0;
  }
  .filter-chip button:hover{ background: color-mix(in srgb, currentColor 26%, transparent); }

  /* ============ TABLE ============ */
  .table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius: var(--radius-l); background:var(--surface); }
  /* Register/Actions tables keep a wide min-width for readability (see
     table.register below), which means they scroll horizontally inside
     .table-wrap on narrow screens — this hint makes that discoverable
     instead of leaving the cut-off columns looking like missing data. */

<script>
/* =====================================================================
   RAID LOG TRACKER — data model, state, rendering, interactions
   ===================================================================== */

/* ---------- persistence: storage keys + earliest-possible theme apply ----
   This runs before anything else in the script — before demo data is even
   built — so a returning viewer's saved theme choice paints on the very
   first frame instead of flashing the default theme for a moment. The data
   (RAID items / actions) loading itself happens later, once the data-model
   constants and the risk-scoring engine it depends on are defined. ---------- */
const STORAGE_KEY = "raidLogTracker.data.v1";
const PREFS_KEY = "raidLogTracker.prefs.v1";

function probeStorage(){
  try{
    const k = "__raidLogTracker_probe__";
    window.localStorage.setItem(k, "1");
    window.localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}
const STORAGE_AVAILABLE = probeStorage();

function loadPrefs(){
  const fallback = { theme:"system", dataMode:"local", googleSheetUrl:null };
  if(!STORAGE_AVAILABLE) return fallback;
  try{
    const raw = window.localStorage.getItem(PREFS_KEY);
    if(!raw) return fallback;
    const parsed = JSON.parse(raw);
    const theme = (parsed && ["system","light","dark"].includes(parsed.theme)) ? parsed.theme : "system";
    const googleSheetUrl = (parsed && typeof parsed.googleSheetUrl==="string" && parsed.googleSheetUrl.trim())
      ? parsed.googleSheetUrl.trim() : null;
    // Google mode is only resumed automatically if we also have a saved Web App URL to
    // reconnect with — otherwise there's nothing to reconnect to, so fall back to Local.
    // A reconnect attempt happens at INIT time (see bottom of file): boot still renders
    // cached local data instantly, then swaps over live if the reconnect succeeds, or
    // stays on Local (with the URL still remembered for one-click retry) if it doesn't.
    let dataMode = "local";
    if(parsed && parsed.dataMode==="demo") dataMode = "demo";
    else if(parsed && parsed.dataMode==="google" && googleSheetUrl) dataMode = "google";
    return { theme, dataMode, googleSheetUrl };
  }catch(e){ return fallback; }
}
function applyTheme(theme){
  if(theme==="light") document.documentElement.setAttribute("data-theme","light");
  else if(theme==="dark") document.documentElement.setAttribute("data-theme","dark");
  else document.documentElement.removeAttribute("data-theme");
}
const initialPrefs = loadPrefs();
applyTheme(initialPrefs.theme);

/* ---------- constants / data model ---------- */
const TYPES = ["Risk","Assumption","Issue","Dependency"];
const TYPE_META = {
  Risk:        { plural:"Risks",        prefix:"RISK", color:"var(--type-risk)",        cls:"pill-type-risk" },
  Assumption:  { plural:"Assumptions",  prefix:"ASM",  color:"var(--type-assumption)",  cls:"pill-type-assumption" },
  Issue:       { plural:"Issues",       prefix:"ISS",  color:"var(--type-issue)",        cls:"pill-type-issue" },
  Dependency:  { plural:"Dependencies", prefix:"DEP",  color:"var(--type-dependency)",  cls:"pill-type-dependency" },
};
const STATUS_BY_TYPE = {
  Risk:       ["Open","In Progress","Monitoring","Accepted","Closed"],
  Assumption: ["Open","In Progress","Accepted","Rejected","Closed"],
  Issue:      ["Open","In Progress","Resolved","Closed"],
  Dependency: ["Open","In Progress","Monitoring","Resolved","Closed"],
};
const CLOSED_STATUSES = ["Closed","Resolved","Rejected"]; // "Accepted" is treated as still active/monitored
const PRIORITIES = ["Low","Medium","High","Critical"];
const SCALE_LABELS = {1:"Very Low",2:"Low",3:"Medium",4:"High",5:"Very High"};
const ACTION_STATUSES = ["Not Started","In Progress","Complete"];
const STATUS_CLASS = {
  "Open":"st-open","In Progress":"st-inprogress","Monitoring":"st-monitoring",
  "Resolved":"st-resolved","Closed":"st-closed","Accepted":"st-accepted","Rejected":"st-rejected"
};

/* ---------- risk scoring engine (single source of truth) ----------
   Risk Score = Probability x Impact, both on a 1-5 scale.
   Bands: 1-4 Low, 5-9 Medium, 10-16 High, 17-25 Critical.
   Every place in the app that shows a score/level (table, detail, form,
   dashboard, reports) calls these two functions — never recomputes inline. */
const RISK_BANDS = [
  { level:"Low",      min:1,  max:4  },
  { level:"Medium",   min:5,  max:9  },
  { level:"High",     min:10, max:16 },
  { level:"Critical", min:17, max:25 },
];
function riskScore(probability, impact){ return Number(probability) * Number(impact); }
function riskLevel(score){
  if(score>=17) return "Critical";
  if(score>=10) return "High";
  if(score>=5) return "Medium";
  return "Low";
}
const SEV_CLASS = { Critical:"pill-sev-critical", High:"pill-sev-high", Medium:"pill-sev-medium", Low:"pill-sev-low" };
const SEV_COLOR = { Critical:"var(--sev-critical)", High:"var(--sev-high)", Medium:"var(--sev-medium)", Low:"var(--sev-low)" };

/* Mini 1-25 scale strip with a marker at the current score — the shared
   "clear visual indicator" used in the edit form, detail view and reports. */
function scoreScaleSVG(score, width){
  width = width || 220;
  const height = 14, max = 25;
  const bands = RISK_BANDS;
  const segs = bands.map(b=>{
    const x1 = ((b.min-1)/max)*width, x2 = (b.max/max)*width;
    return `<rect x="${x1.toFixed(1)}" y="0" width="${(x2-x1).toFixed(1)}" height="${height}" fill="${SEV_COLOR[b.level]}" opacity="0.32"></rect>`;
  }).join("");
  const markerX = Math.min(width-1, Math.max(1, (score/max)*width));
  return `<svg width="${width}" height="${height+8}" viewBox="0 0 ${width} ${height+8}" role="img" aria-label="Risk score ${score} of ${max}">
    <g>${segs}</g>
    <rect x="0" y="0" width="${width}" height="${height}" fill="none" stroke="var(--border)"></rect>
    <line x1="${markerX.toFixed(1)}" y1="-2" x2="${markerX.toFixed(1)}" y2="${height+2}" stroke="var(--text-primary)" stroke-width="2"></line>
    <circle cx="${markerX.toFixed(1)}" cy="${height/2}" r="3.2" fill="var(--text-primary)"></circle>
  </svg>`;
}
/* Reference legend for the four bands - shown wherever a reader needs the key. */
function riskBandLegend(){
  return `<div class="legend risk-band-legend">${RISK_BANDS.map(b=>`
    <span class="legend-item"><span class="legend-swatch" style="background:${SEV_COLOR[b.level]}"></span>${b.level} <span class="mono" style="color:var(--text-muted)">(${b.min}–${b.max})</span></span>`).join("")}</div>`;
}

function isOpenStatus(status){ return !CLOSED_STATUSES.includes(status); }

/* ---------- date helpers ---------- */
function todayISO(){ const d=new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
function offsetISO(days){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function parseISO(s){ if(!s) return null; const d=new Date(s+"T00:00:00"); return isNaN(d) ? null : d; }
function daysBetween(fromISO, toISO){
  const a = parseISO(fromISO), b = parseISO(toISO);
  if(!a || !b) return null;
  return Math.round((b-a)/86400000);
}
function fmtDate(iso){
  if(!iso) return "—";
  const d = parseISO(iso); if(!d) return "—";
  return d.toLocaleDateString(undefined,{ year:"numeric", month:"short", day:"numeric" });
}
function fmtDateShort(iso){
  if(!iso) return "—";
  const d = parseISO(iso); if(!d) return "—";
  return d.toLocaleDateString(undefined,{ month:"short", day:"numeric" });
}
function dueTiming(iso, status){
  if(!iso) return "none";
  if(status && CLOSED_STATUSES.includes(status)) return "closed";
  const n = daysBetween(todayISO(), iso);
  if(n===null) return "none";
  if(n<0) return "overdue";
  if(n<=7) return "soon";
  return "normal";
}
function relativeDueLabel(iso, status){
  const timing = dueTiming(iso, status);
  const n = daysBetween(todayISO(), iso);
  if(timing==="closed") return fmtDateShort(iso);
  if(n===null) return "—";
  if(n<0) return `${Math.abs(n)}d overdue`;
  if(n===0) return "Due today";
  if(n<=7) return `Due in ${n}d`;
  return fmtDateShort(iso);
}

/* ---------- shared "Due date" range filter (RAID Register + Actions) ----------
   A deliberately separate control from the "Overdue" toggle: Overdue always
   means "in the past"; these buckets are forward-looking upcoming-due windows
   (or "no due date set" at all), so the two compose without ever fighting
   over the same items. */
const DUE_RANGE_OPTIONS = [
  { value:"", label:"Any due date" },
  { value:"today", label:"Due today" },
  { value:"week", label:"Due within 7 days" },
  { value:"month", label:"Due within 30 days" },
  { value:"none", label:"No due date set" },
];
const DUE_RANGE_LABEL = Object.fromEntries(DUE_RANGE_OPTIONS.map(o=>[o.value, o.label]));
function inDueRange(iso, isOpen, range){
  if(!range) return true;
  if(range==="none") return !iso;
  if(!iso || !isOpen) return false;
  const n = daysBetween(todayISO(), iso);
  if(n===null) return false;
  if(range==="today") return n===0;
  if(range==="week") return n>=0 && n<=7;
  if(range==="month") return n>=0 && n<=30;
  return true;
}

/* ---------- id generation ---------- */
const idCounters = { Risk:0, Assumption:0, Issue:0, Dependency:0 };
function nextId(type){
  idCounters[type] += 1;
  return `${TYPE_META[type].prefix}-${String(idCounters[type]).padStart(3,"0")}`;
}
function previewNextId(type){
  return `${TYPE_META[type].prefix}-${String(idCounters[type]+1).padStart(3,"0")}`;
}
function registerExistingId(item){
  const n = parseInt(item.id.split("-")[1],10);
  if(!isNaN(n) && n > idCounters[item.type]) idCounters[item.type] = n;
}

/* Actions are a separate, first-class collection (their own IDs, own CRUD,
   own page) rather than fields embedded in a RAID item. */
let actionIdCounter = 0;
function nextActionId(){ actionIdCounter += 1; return `ACT-${String(actionIdCounter).padStart(3,"0")}`; }
function previewNextActionId(){ return `ACT-${String(actionIdCounter+1).padStart(3,"0")}`; }
function registerExistingActionId(action){
  const n = parseInt(String(action.id).split("-")[1], 10);
  if(!isNaN(n) && n > actionIdCounter) actionIdCounter = n;
}
/* Recompute both ID counters from whatever RAID items / actions are actually
   in play (loaded from storage, imported, or reset to demo data) so the next
   nextId()/nextActionId() call always continues past the highest ID present
   — regardless of where that data came from. Safer than persisting/trusting
   the counters themselves. */
function resyncIdCounters(items, actions){
  idCounters.Risk = 0; idCounters.Assumption = 0; idCounters.Issue = 0; idCounters.Dependency = 0;
  actionIdCounter = 0;
  items.forEach(registerExistingId);
  actions.forEach(registerExistingActionId);
}
const ACTION_STATUSES_FULL = ["Not Started","In Progress","Complete"];
function isActionOverdue(a){ return !!a.dueDate && a.status!=="Complete" && daysBetween(todayISO(), a.dueDate) < 0; }
function actionDueTiming(a){
  if(!a.dueDate) return "none";
  if(a.status==="Complete") return "complete";
  const n = daysBetween(todayISO(), a.dueDate);
  if(n===null) return "none";
  if(n<0) return "overdue";
  if(n<=7) return "soon";
  return "normal";
}

/* ---------- demo data ---------- */
const OWNERS = ["Saied","Bilal Azzam","More than one of the team","QC-Team","Squad team","Mohamed Azzam","Azzam & Saied","All People","Azzam"];
const PROJECTS = {
  "Team Retro — Red Flags": ["Delivery & Execution","Process & Ways of Working","Team & Culture","Tooling & Automation"],

      item.riskLevel = riskLevel(item.riskScore);
      item.priority = item.riskLevel; // priority derives from risk score for Risk items
    } else {
      item.probability = null; item.impact = null; item.riskScore = null; item.riskLevel = null;
      item.priority = item.priority || "Medium";
    }
    item.createdDate = d(-((RAW_ITEMS.length - i) + 60));

      { date:item.createdDate, note:`${item.type} logged by ${item.owner}.` },

    if(item.status !== "Open"){
      item.history.push({ date:item.dateRaised, note:`Status set to "${item.status}".` });
    }
    return item;
  });
}

/* ---------- dataset validation / normalization ----------
   Shared by both load paths that hand this app data it didn't just create
   itself — reading back from local storage, and importing a JSON backup —
   so both get exactly the same "don't trust what you're handed" treatment:
   records that don't look like a real RAID item / action are dropped
   rather than crashing the whole load, and every kept record is backfilled
   for any field an older or hand-edited export might be missing. Risk
   Score / Risk Level are always recomputed from probability x impact here
   rather than trusted from the file, so a tampered or stale export can't
   show a score that doesn't match its own probability/impact. ---------- */
function isValidRaidItem(it){
  if(!it || typeof it!=="object") return false;
  if(!TYPES.includes(it.type)) return false;
  if(typeof it.id!=="string" || !it.id.trim()) return false;
  if(!it.id.startsWith(TYPE_META[it.type].prefix + "-")) return false; // e.g. a "Risk" must be "RISK-###"
  if(typeof it.title!=="string" || !it.title.trim()) return false;
  if(!STATUS_BY_TYPE[it.type].includes(it.status)) return false;
  if(typeof it.owner!=="string" || !it.owner.trim()) return false;
  if(typeof it.project!=="string" || !it.project.trim()) return false;
  if(typeof it.workstream!=="string" || !it.workstream.trim()) return false;
  if(typeof it.dateRaised!=="string" || !parseISO(it.dateRaised)) return false;
  if(it.type==="Risk"){
    const p = Number(it.probability), i = Number(it.impact);
    if(!Number.isFinite(p) || p<1 || p>5 || !Number.isFinite(i) || i<1 || i>5) return false;
  }
  return true;
}
function normalizeRaidItem(raw){
  const it = Object.assign({}, raw);
  it.description = typeof it.description==="string" ? it.description : "";
  it.priority = PRIORITIES.includes(it.priority) ? it.priority : "Medium";
  it.dueDate = typeof it.dueDate==="string" ? it.dueDate : "";
  it.reviewDate = typeof it.reviewDate==="string" ? it.reviewDate : "";
  it.mitigation = typeof it.mitigation==="string" ? it.mitigation : "";
  it.action = typeof it.action==="string" ? it.action : "";
  it.actionOwner = typeof it.actionOwner==="string" ? it.actionOwner : "";
  it.actionDueDate = typeof it.actionDueDate==="string" ? it.actionDueDate : "";
  it.actionStatus = typeof it.actionStatus==="string" ? it.actionStatus : "";
  it.actionCompletion = Number.isFinite(Number(it.actionCompletion)) ? Number(it.actionCompletion) : 0;
  it.createdDate = (typeof it.createdDate==="string" && it.createdDate) ? it.createdDate : it.dateRaised;
  it.lastUpdated = (typeof it.lastUpdated==="string" && it.lastUpdated) ? it.lastUpdated : it.dateRaised;
  it.history = Array.isArray(it.history) ? it.history.filter(h=>h && typeof h.note==="string") : [];
  if(it.type==="Risk"){
    it.probability = Number(it.probability);
    it.impact = Number(it.impact);
    it.riskScore = riskScore(it.probability, it.impact);
    it.riskLevel = riskLevel(it.riskScore);
  } else {
    it.probability = null; it.impact = null; it.riskScore = null; it.riskLevel = null;
  }
  return it;
}
function isValidAction(a){
  if(!a || typeof a!=="object") return false;
  if(typeof a.id!=="string" || !a.id.trim()) return false;
  if(typeof a.description!=="string" || !a.description.trim()) return false;
  if(!ACTION_STATUSES_FULL.includes(a.status)) return false;
  if(typeof a.owner!=="string" || !a.owner.trim()) return false;
  return true;
}
function normalizeAction(raw){
  const a = Object.assign({}, raw);
  a.relatedItem = typeof a.relatedItem==="string" ? a.relatedItem : "";
  a.priority = PRIORITIES.includes(a.priority) ? a.priority : "Medium";
  a.dueDate = typeof a.dueDate==="string" ? a.dueDate : "";
  a.completionPct = Number.isFinite(Number(a.completionPct)) ? Math.max(0, Math.min(100, Number(a.completionPct))) : 0;
  a.createdDate = (typeof a.createdDate==="string" && a.createdDate) ? a.createdDate : todayISO();
  a.lastUpdated = (typeof a.lastUpdated==="string" && a.lastUpdated) ? a.lastUpdated : a.createdDate;
  a.history = Array.isArray(a.history) ? a.history.filter(h=>h && typeof h.note==="string") : [];
  return a;
}
function validateAndNormalizeDataset(parsed){
  if(!parsed || typeof parsed!=="object") return { ok:false, reason:"That file doesn't look like a RAID Log Tracker backup." };
  const rawItems = Array.isArray(parsed.items) ? parsed.items : null;
  const rawActions = Array.isArray(parsed.actions) ? parsed.actions : null;
  if(!rawItems || !rawActions) return { ok:false, reason:'Expected "items" and "actions" arrays in the file.' };

  let droppedItems = 0, droppedActions = 0;
  const seenItemIds = new Set();
  const items = [];
  rawItems.forEach(raw=>{
    if(isValidRaidItem(raw) && !seenItemIds.has(raw.id)){ seenItemIds.add(raw.id); items.push(normalizeRaidItem(raw)); }
    else droppedItems++;
  });
  const seenActionIds = new Set();
  const actions = [];
  rawActions.forEach(raw=>{
    if(isValidAction(raw) && !seenActionIds.has(raw.id)){ seenActionIds.add(raw.id); actions.push(normalizeAction(raw)); }
    else droppedActions++;
  });
  if(!items.length && !actions.length) return { ok:false, reason:"No valid RAID items or actions were found in the file." };
  return { ok:true, items, actions, droppedItems, droppedActions };
}
function loadStoredData(){
  if(!STORAGE_AVAILABLE) return { ok:false, reason:"unavailable" };
  let raw;
  try{ raw = window.localStorage.getItem(STORAGE_KEY); }catch(e){ return { ok:false, reason:"unavailable" }; }
  if(raw==null) return { ok:false, reason:"none" };
  let parsed;
  try{ parsed = JSON.parse(raw); }catch(e){ return { ok:false, reason:"corrupt" }; }
  const result = validateAndNormalizeDataset(parsed);
  if(!result.ok) return { ok:false, reason:"invalid", detail: result.reason };
  return result;
}
function deepClone(x){ return JSON.parse(JSON.stringify(x)); }

/* Handles the four required boot states: first-time visitor (no stored
   data yet), a returning visitor with valid stored data, a returning
   visitor whose stored data is corrupt/unreadable/invalid, and the
   no-localStorage-available edge case — always resolving to a usable
   items/actions pair plus an optional one-line notice for the toast. */
function computeBoot(){
  if(!STORAGE_AVAILABLE){
    return {
      items: deepClone(ORIGINAL_DEMO_ITEMS), actions: deepClone(ORIGINAL_DEMO_ACTIONS),
      notice: "This browser context doesn't allow local storage, so changes won't be saved between visits.",
      firstRun:true, canPersist:false,
    };
  }
  const stored = loadStoredData();
  if(stored.ok){
    const parts = [];
    if(stored.droppedItems) parts.push(`${stored.droppedItems} invalid RAID item${stored.droppedItems===1?"":"s"}`);
    if(stored.droppedActions) parts.push(`${stored.droppedActions} invalid action${stored.droppedActions===1?"":"s"}`);
    return {
      items: stored.items, actions: stored.actions,
      notice: parts.length ? `Loaded your saved data — skipped ${parts.join(" and ")}.` : null,
      firstRun:false, canPersist:true,
    };
  }
  if(stored.reason==="none"){
    return { items: deepClone(ORIGINAL_DEMO_ITEMS), actions: deepClone(ORIGINAL_DEMO_ACTIONS), notice:null, firstRun:true, canPersist:true };
  }
  return {
    items: deepClone(ORIGINAL_DEMO_ITEMS), actions: deepClone(ORIGINAL_DEMO_ACTIONS),
    notice: "Your saved data couldn't be read, so demo data was loaded instead.",
    firstRun:false, canPersist:true,
  };
}

/* =========================================================================
   DATA SERVICE ABSTRACTION
   -------------------------------------------------------------------------
   The UI (render functions + click/input handlers) never touches
   localStorage or a Google Sheet directly, and never assumes which one is
   behind the data. It only ever calls methods on `dataService`
   (getActiveDataService()) — getRaidItems/createRaidItem/updateRaidItem/
   deleteRaidItem, getActions/createAction/updateAction/deleteAction,
   getProjects/getWorkstreams, syncFromGoogleSheets/syncToGoogleSheets.
   Three concrete services implement that same interface:

     LocalDataService   — real, working. Backs onto this browser's
                           localStorage (exactly the persistence this app
                           already had).
     DemoDataService     — real, working. Serves the baked-in sample
                           dataset; writes are in-memory only for the
                           session and are never saved.
     GoogleSheetsDataService — a real, working implementation that talks to
                           a Google Apps Script Web App bound to the target
                           Sheet (see the accompanying Code.gs backend and
                           deployment steps). It only reaches Google when
                           this page is hosted somewhere with real outbound
                           network access — a published Claude Artifact's
                           sandbox still blocks it, so connecting from
                           inside the Artifact preview will fail with a
                           network error rather than pretend to succeed.
                           See Settings → Data Source for the connection
                           field format and deployment steps.

   A fourth class, MockGoogleSheetsDataService, simulates a real remote
   sheet (with latency, independent-edit/conflict detection, and
   injectable failures) purely so the whole integration — mapping, CRUD,
   sync, conflicts — can be exercised and tested without real credentials
   (see window.__RAID_TEST__ below). It is not used by the live UI unless
   a test explicitly installs it in place of GoogleSheetsDataService.
   ========================================================================= */

/* ---- Google Sheet column layout (per the target workbook's 4 tabs) ---- */
const SHEET_COLUMNS = {
  RAID: ["ID","Type","Title","Description","Project","Workstream","Owner","Status","Priority",
    "Date Raised","Due Date","Review Date","Probability","Impact","Risk Score","Risk Level",
    "Mitigation","Action","Action Owner","Action Due Date","Related Item","Notes","Created Date","Last Updated"],
  ACTIONS: ["Action ID","Related RAID ID","Description","Owner","Due Date","Status","Priority","Completion %","Created Date","Last Updated"],
  PROJECTS: ["Project ID","Project Name","Project Manager","Status","Start Date","End Date"],
  WORKSTREAMS: ["Workstream ID","Project ID","Workstream Name","Owner","Status"],
};

/* ---- cell parsing: sheet cells arrive as loosely-typed strings/blanks ---- */
function cellStr(v){ return v==null ? "" : String(v).trim(); }
function cellNumber(v){
  if(v==null || v==="") return null;
  const n = Number(v);
  return isNaN(n) ? null : n;
}
function cellDate(v){
  if(v==null || v==="") return "";
  if(v instanceof Date) return isNaN(v) ? "" : v.toISOString().slice(0,10);
  const s = String(v).trim();
  if(!s) return "";
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10); // already ISO
  const d = new Date(s);
  return isNaN(d) ? "" : d.toISOString().slice(0,10);
}
function cellBool(v){
  if(typeof v==="boolean") return v;
  const s = cellStr(v).toLowerCase();
  return s==="true" || s==="yes" || s==="1";
}

/* ---- Sheet row <-> app object mapping ----
   Handles empty cells, dates, numbers, booleans, invalid risk scores and
   missing IDs. Risk Score/Risk Level are ALWAYS recomputed by the app from
   Probability x Impact — a value sitting in the sheet's own Risk Score /
   Risk Level columns is read for reference only and is never trusted. */
function mapRowToRaidItem(row){
  row = row || {};
  let type = cellStr(row["Type"]);
  if(!TYPES.includes(type)) type = "Risk";
  const probability = cellNumber(row["Probability"]);
  const impact = cellNumber(row["Impact"]);
  const isRisk = type==="Risk";
  const p = isRisk ? (probability && probability>=1 && probability<=5 ? probability : 3) : null;
  const i = isRisk ? (impact && impact>=1 && impact<=5 ? impact : 3) : null;
  const score = isRisk ? riskScore(p, i) : null;
  const level = isRisk ? riskLevel(score) : null;
  const id = cellStr(row["ID"]) || nextId(type); // missing ID in the sheet -> app assigns a stable one
  const project = cellStr(row["Project"]) || Object.keys(PROJECTS)[0];
  const status = cellStr(row["Status"]) || STATUS_BY_TYPE[type][0];
  return normalizeRaidItem({
    id, type,
    title: cellStr(row["Title"]) || "(untitled)",
    description: cellStr(row["Description"]),
    project,
    workstream: cellStr(row["Workstream"]) || (PROJECTS[project]||[])[0] || "",
    owner: cellStr(row["Owner"]) || "Unassigned",
    status,
    priority: isRisk ? level : (cellStr(row["Priority"]) || "Medium"),
    dateRaised: cellDate(row["Date Raised"]) || todayISO(),
    dueDate: cellDate(row["Due Date"]),
    reviewDate: cellDate(row["Review Date"]),
    probability: p, impact: i, riskScore: score, riskLevel: level,
    mitigation: cellStr(row["Mitigation"]),
    action: cellStr(row["Action"]),
    actionOwner: cellStr(row["Action Owner"]),
    actionDueDate: cellDate(row["Action Due Date"]),
    actionStatus: "", actionCompletion: 0,
    relatedItem: cellStr(row["Related Item"]),
    notes: cellStr(row["Notes"]),
    createdDate: cellDate(row["Created Date"]) || todayISO(),
    lastUpdated: cellDate(row["Last Updated"]) || todayISO(),
    history: [],
  });
}
function mapRaidItemToRow(item){
  item = item || {};
  return {
    "ID": item.id||"", "Type": item.type||"", "Title": item.title||"", "Description": item.description||"",
    "Project": item.project||"", "Workstream": item.workstream||"", "Owner": item.owner||"", "Status": item.status||"",
    "Priority": item.priority||"", "Date Raised": item.dateRaised||"", "Due Date": item.dueDate||"", "Review Date": item.reviewDate||"",
    "Probability": item.probability==null?"":item.probability, "Impact": item.impact==null?"":item.impact,
    "Risk Score": item.riskScore==null?"":item.riskScore, "Risk Level": item.riskLevel||"",
    "Mitigation": item.mitigation||"", "Action": item.action||"", "Action Owner": item.actionOwner||"",
    "Action Due Date": item.actionDueDate||"", "Related Item": item.relatedItem||"", "Notes": item.notes||"",
    "Created Date": item.createdDate||"", "Last Updated": item.lastUpdated||"",
  };
}
function mapRowToAction(row){
  row = row || {};
  let completion = cellNumber(row["Completion %"]); if(completion==null) completion = 0;
  completion = Math.max(0, Math.min(100, completion));
  let status = cellStr(row["Status"]) || "Not Started";
  if(!ACTION_STATUSES_FULL.includes(status)) status = "Not Started";
  if(completion===100) status = "Complete";
  if(status==="Complete") completion = 100;
  const id = cellStr(row["Action ID"]) || nextActionId(); // missing ID -> app assigns a stable one
  return normalizeAction({
    id,
    relatedItem: cellStr(row["Related RAID ID"]),
    description: cellStr(row["Description"]) || "(no description)",
    owner: cellStr(row["Owner"]) || "Unassigned",
    dueDate: cellDate(row["Due Date"]),
    status,
    priority: cellStr(row["Priority"]) || "Medium",
    completionPct: completion,
    createdDate: cellDate(row["Created Date"]) || todayISO(),
    lastUpdated: cellDate(row["Last Updated"]) || todayISO(),
    history: [],
  });
}
function mapActionToRow(a){
  a = a || {};
  return {
    "Action ID": a.id||"", "Related RAID ID": a.relatedItem||"", "Description": a.description||"", "Owner": a.owner||"",
    "Due Date": a.dueDate||"", "Status": a.status||"", "Priority": a.priority||"",
    "Completion %": a.completionPct==null?0:a.completionPct,
    "Created Date": a.createdDate||"", "Last Updated": a.lastUpdated||"",
  };
}
function mapRowToProject(row){
  row = row || {};
  return {
    id: cellStr(row["Project ID"]) || cellStr(row["Project Name"]),
    name: cellStr(row["Project Name"]), manager: cellStr(row["Project Manager"]),
    status: cellStr(row["Status"]) || "Active",
    startDate: cellDate(row["Start Date"]), endDate: cellDate(row["End Date"]),
  };
}
function mapRowToWorkstream(row){
  row = row || {};
  return {
    id: cellStr(row["Workstream ID"]) || cellStr(row["Workstream Name"]),
    projectId: cellStr(row["Project ID"]), name: cellStr(row["Workstream Name"]),
    owner: cellStr(row["Owner"]), status: cellStr(row["Status"]) || "Active",
  };
}
/* Projects/Workstreams don't have their own editable records in this build
   (the app's single source for them is the PROJECTS map) — these adapt that
   map to the shape getProjects()/getWorkstreams() are expected to return,
   so the interface is honored even though there's no separate CRUD UI for
   them yet. */
function projectsAsList(){
  return Object.keys(PROJECTS).map(name=>mapRowToProject({ "Project ID":name, "Project Name":name, "Status":"Active" }));
}
function workstreamsAsList(){
  const list = [];
  Object.entries(PROJECTS).forEach(([proj, streams])=>{
    (streams||[]).forEach(ws=> list.push(mapRowToWorkstream({ "Workstream ID":`${proj}::${ws}`, "Project ID":proj, "Workstream Name":ws, "Status":"Active" })));
  });
  return list;
}

/* ---- GoogleSheetsDataService: real live-sync implementation ----
   Talks to a Google Apps Script Web App bound to the target Sheet (see the
   companion Code.gs backend + deployment steps). The "Google Sheet" field
   in Settings doubles as the full endpoint: paste the Apps Script Web App's
   /exec URL with ?token=YOUR_SECRET appended, e.g.
     https://script.google.com/macros/s/AKfycb.../exec?token=abc123
   All mapping (row <-> app object, ID assignment, risk score calculation)
   stays in THIS file — the Apps Script backend only ever reads/writes
   plain rows keyed by the sheet's own header names, so Risk Score/Level are
   still always recomputed here, never trusted from the sheet.
   This only actually reaches Google once the page is hosted somewhere with
   real outbound network access — a published Claude Artifact's sandbox
   still blocks it, so connecting from inside the Artifact preview fails
   with a network error (see _friendlyNetworkError below) rather than
   pretending to succeed. */
class GoogleSheetsDataService {
  constructor(){ this.name = "Google Sheets"; this.sheetUrl = null; this._revision = null; }
  _endpoint(action){
    if(!this.sheetUrl) throw new Error("No Google Sheet connected yet.");
    const sep = this.sheetUrl.includes("?") ? "&" : "?";
    return `${this.sheetUrl}${sep}action=${encodeURIComponent(action)}`;
  }
  _friendlyNetworkError(err){
    const msg = (err && err.message) || String(err);
    return new Error(
      `Couldn't reach the Google Sheet backend (${msg}). If this app is running inside a published Claude `+
      `Artifact, that's expected — its sandbox blocks outbound network calls, so live sync only works once `+
      `this app is hosted somewhere with real network access. See Settings → Data Source for the Apps Script `+
      `deployment steps.`
    );
  }
  _get(action){
    return Promise.resolve()
      .then(()=> fetch(this._endpoint(action)))
      .then(r=> r.json())
      .catch(err=>{ throw this._friendlyNetworkError(err); })
      .then(data=>{ if(data && data.error) throw new Error(data.error); return data; });
  }
  _post(action, payload){
    return Promise.resolve()
      .then(()=> fetch(this._endpoint(action), {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids a CORS preflight Apps Script can't answer
        body: JSON.stringify(payload || {}),
      }))
      .then(r=> r.json())
      .catch(err=>{ throw this._friendlyNetworkError(err); })
      .then(data=>{ if(data && data.error) throw new Error(data.error); return data; });
  }
  connect(sheetUrl){
    this.sheetUrl = (sheetUrl||"").trim() || null;
    if(!this.sheetUrl) return Promise.reject(new Error("Paste your Apps Script Web App URL (with ?token=...) first."));
    return this._get("getRevision").then(data=>{ this._revision = data.revision; return true; });
  }
  disconnect(){ this.sheetUrl = null; this._revision = null; return Promise.resolve(); }
  loadAll(){
    return this._get("loadAll").then(data=>{
      this._revision = data.revision;
      return {
        items: (data.items||[]).map(mapRowToRaidItem),
        actions: (data.actions||[]).map(mapRowToAction),
        notice: null, firstRun:false, canPersist:true,
      };
    });
  }
  getRaidItems(){ return this._get("getRaidItems").then(d=> (d.rows||[]).map(mapRowToRaidItem)); }
  getActions(){ return this._get("getActions").then(d=> (d.rows||[]).map(mapRowToAction)); }
  getProjects(){ return this._get("getProjects").then(d=> (d.rows||[]).map(mapRowToProject)); }
  getWorkstreams(){ return this._get("getWorkstreams").then(d=> (d.rows||[]).map(mapRowToWorkstream)); }
  createRaidItem(item){
    return this._post("createRow", { sheet:"RAID", idColumn:"ID", row: mapRaidItemToRow(item) }).then(()=> item);
  }
  updateRaidItem(id, item){
    return this._post("updateRow", { sheet:"RAID", idColumn:"ID", id, row: mapRaidItemToRow(item) }).then(()=> item);
  }
  deleteRaidItem(id){
    return this._post("deleteRow", { sheet:"RAID", idColumn:"ID", id }).then(()=> ({id}));
  }
  createAction(a){
    return this._post("createRow", { sheet:"ACTIONS", idColumn:"Action ID", row: mapActionToRow(a) }).then(()=> a);
  }
  updateAction(id, a){
    return this._post("updateRow", { sheet:"ACTIONS", idColumn:"Action ID", id, row: mapActionToRow(a) }).then(()=> a);
  }
  deleteAction(id){
    return this._post("deleteRow", { sheet:"ACTIONS", idColumn:"Action ID", id }).then(()=> ({id}));
  }
  syncFromGoogleSheets(){
    return this._get("loadAll").then(data=>{
      const conflict = this._revision!=null && data.revision!==this._revision;
      this._revision = data.revision;
      return {
        items: (data.items||[]).map(mapRowToRaidItem),
        actions: (data.actions||[]).map(mapRowToAction),
        conflict,
      };
    });
  }
  syncToGoogleSheets(items, actions){
    return this._post("replaceAll", {
      baseRevision: this._revision,
      raidRows: (items||[]).map(mapRaidItemToRow),
      actionRows: (actions||[]).map(mapActionToRow),
    }).then(data=>{
      if(data.conflict) return { ok:false, conflict:true, message: data.message || "Google Sheet has changed since the last sync." };
      this._revision = data.revision;
      return { ok:true, conflict:false };
    });
  }
}

/* ---- MockGoogleSheetsDataService: a real fake remote sheet, for testing ----
   Simulates network latency, lets a test edit the "remote" sheet out from
   under the app (to trigger conflict detection), and exposes failNext /
   offline switches to simulate a failed sync and offline mode. Used by the
   Playwright integration tests via window.__RAID_TEST__.installMockGoogleSheets(),
   which substitutes it for GoogleSheetsDataService so Google mode can be
   exercised end-to-end without real credentials. */
class MockGoogleSheetsDataService {
  constructor(seedItems, seedActions){
    this.name = "Google Sheets (mock, for testing)";
    this._items = deepClone(seedItems||[]);
    this._actions = deepClone(seedActions||[]);
    this._remoteRevision = 1;
    this._lastSyncedRevision = 1;
    this.latencyMs = 5;
    this.failNext = false;
    this.offline = false;
  }
  _delay(fn){
    return new Promise((resolve, reject)=>{
      setTimeout(()=>{
        if(this.offline){ reject(new Error("Offline — can't reach Google Sheets.")); return; }
        if(this.failNext){ this.failNext = false; reject(new Error("Simulated Google Sheets API failure.")); return; }
        try{ resolve(fn()); }catch(e){ reject(e); }
      }, this.latencyMs);
    });
  }
  // Test-only: mutate the "remote" sheet as if someone edited it directly in
  // Google Sheets, independent of this app, so a later sync sees a conflict.
  simulateExternalEdit(mutator){ mutator(this._items, this._actions); this._remoteRevision++; }
  hasRemoteChangedSinceSync(){ return this._remoteRevision !== this._lastSyncedRevision; }
  _reconcileRow(row){
    if(row.type==="Risk" && row.probability && row.impact){
      row.riskScore = riskScore(row.probability, row.impact);
      row.riskLevel = riskLevel(row.riskScore);
    }
    return row;
  }
  connect(sheetUrl){ this.sheetUrl = sheetUrl||null; return this._delay(()=>true); }
  disconnect(){ return this._delay(()=>true); }
  loadAll(){
    return this._delay(()=>({
      items: deepClone(this._items).map(r=>this._reconcileRow(r)),
      actions: deepClone(this._actions),
      notice: null, firstRun:false, canPersist:true,
    }));
  }
  getRaidItems(){ return this._delay(()=> deepClone(this._items).map(r=>this._reconcileRow(r))); }
  getActions(){ return this._delay(()=> deepClone(this._actions)); }
  getProjects(){ return this._delay(()=> projectsAsList()); }
  getWorkstreams(){ return this._delay(()=> workstreamsAsList()); }
  createRaidItem(item){
    return this._delay(()=>{
      if(!item.id || this._items.some(it=>it.id===item.id)) item.id = nextId(item.type); // avoid duplicate IDs
      this._items.unshift(item); this._remoteRevision++; this._lastSyncedRevision = this._remoteRevision;
      return item;
    });
  }
  updateRaidItem(id, item){
    return this._delay(()=>{
      const idx = this._items.findIndex(it=>it.id===id);
      if(idx<0) throw new Error(`RAID item ${id} not found on the sheet.`);
      this._items[idx] = item; this._remoteRevision++; this._lastSyncedRevision = this._remoteRevision;
      return item;
    });
  }
  deleteRaidItem(id){
    return this._delay(()=>{
      const idx = this._items.findIndex(it=>it.id===id);
      if(idx<0) return null;
      const removed = this._items.splice(idx,1)[0];
      this._remoteRevision++; this._lastSyncedRevision = this._remoteRevision;
      return removed;
    });
  }
  createAction(a){
    return this._delay(()=>{
      if(!a.id || this._actions.some(x=>x.id===a.id)) a.id = nextActionId();
      this._actions.unshift(a); this._remoteRevision++; this._lastSyncedRevision = this._remoteRevision;
      return a;
    });
  }
  updateAction(id, a){
    return this._delay(()=>{
      const idx = this._actions.findIndex(x=>x.id===id);
      if(idx<0) throw new Error(`Action ${id} not found on the sheet.`);
      this._actions[idx] = a; this._remoteRevision++; this._lastSyncedRevision = this._remoteRevision;
      return a;
    });
  }
  deleteAction(id){
    return this._delay(()=>{
      const idx = this._actions.findIndex(x=>x.id===id);
      if(idx<0) return null;
      const removed = this._actions.splice(idx,1)[0];
      this._remoteRevision++; this._lastSyncedRevision = this._remoteRevision;
      return removed;
    });
  }
  syncFromGoogleSheets(){
    return this._delay(()=>{
      const conflict = this.hasRemoteChangedSinceSync();
      this._lastSyncedRevision = this._remoteRevision;
      return { items: deepClone(this._items).map(r=>this._reconcileRow(r)), actions: deepClone(this._actions), conflict };
    });
  }
  syncToGoogleSheets(items, actions){
    return this._delay(()=>{
      if(this.hasRemoteChangedSinceSync()){
        return { ok:false, conflict:true, message:"Google Sheet has changed since the last sync." };
      }
      this._items = deepClone(items); this._actions = deepClone(actions);
      this._remoteRevision++; this._lastSyncedRevision = this._remoteRevision;
      return { ok:true, conflict:false };
    });
  }
}

/* ---- active data service selection ---- */
const localDataServiceInstance = new LocalDataService();
const demoDataServiceInstance = new DemoDataService();
const googleSheetsDataServiceInstance = new GoogleSheetsDataService();
// Pre-load the last-used Web App URL (if any) so Settings → Data Source shows it
// immediately and the auto-reconnect attempt at INIT time (bottom of file) has it
// to work with, even before/without a successful connection this session.
if(initialPrefs.googleSheetUrl) googleSheetsDataServiceInstance.sheetUrl = initialPrefs.googleSheetUrl;
let _activeGoogleService = null;   // whichever Google-mode instance actually connected (real or test-installed mock)
let _testGoogleOverride = null;    // set by window.__RAID_TEST__.installMockGoogleSheets() for integration tests
function getActiveDataService(){
  if(state.dataMode==="demo") return demoDataServiceInstance;
  if(state.dataMode==="google") return _activeGoogleService || _testGoogleOverride || googleSheetsDataServiceInstance;
  return localDataServiceInstance;
}
/* After any create/update/delete, pull the authoritative full lists back
   from whichever service is active — this is what lets Local (which
   mutates `state` directly), Demo (in-memory only) and a remote mock (its
   own private store) all be treated identically by the UI. */
function refreshFromService(){
  const svc = getActiveDataService();
  return Promise.all([svc.getRaidItems(), svc.getActions()]).then(([items, actions])=>{
    state.items = items; state.actions = actions;
    resyncIdCounters(items, actions);
  });
}
function dataModeLabel(mode){ return mode==="google" ? "Google Sheets" : mode==="demo" ? "Demo data" : "Local storage"; }

/* ---- Settings -> Data Source actions ---- */
function setDataMode(mode){
  if(mode==="google"){
    const input = document.getElementById("ds-sheet-url");
    connectGoogleSheet(input ? input.value.trim() : "");
    return;
  }
  if(state.dataMode===mode) return;
  state.dataMode = mode;
  _activeGoogleService = null;
  persistPrefs();
  state.sync.status = "syncing"; state.sync.error = null; state.ui.conflict = null;
  scheduleRender();
  getActiveDataService().loadAll().then(result=>{
    state.items = result.items; state.actions = result.actions;
    resyncIdCounters(state.items, state.actions);
    state.ui.detailId = null; state.ui.modal = null; state.ui.actionModal = null;
    state.ui.search = ""; state.ui.filters = defaultFilters();
    state.ui.actionsSearch = ""; state.ui.actionsFilters = defaultActionFilters();
    state.sync.status = mode==="local" ? (STORAGE_AVAILABLE ? "synced" : "offline") : "offline";
    state.sync.lastSyncedAt = mode==="local" ? new Date().toISOString() : null;
    showToast(result.notice || `Switched to ${dataModeLabel(mode)}.`);
    scheduleRender();
  }).catch(err=>{
    state.sync.status = "error"; state.sync.error = err.message || String(err);
    scheduleRender();
  });
}
function connectGoogleSheet(url, opts){
  const auto = !!(opts && opts.auto); // true only for the silent reconnect attempt at boot
  state.ui.conflict = null;
  state.sync.status = "syncing"; state.sync.error = null;
  scheduleRender();
  const svcToTry = _testGoogleOverride || googleSheetsDataServiceInstance;
  svcToTry.connect(url).then(()=> svcToTry.loadAll()).then(result=>{
    state.dataMode = "google";
    _activeGoogleService = svcToTry;
    persistPrefs();
    state.items = result.items; state.actions = result.actions;
    resyncIdCounters(state.items, state.actions);
    state.ui.detailId = null; state.ui.modal = null; state.ui.actionModal = null;
    state.sync.status = "connected"; state.sync.lastSyncedAt = new Date().toISOString(); state.sync.error = null;
    showToast(auto ? "Reconnected to Google Sheets." : "Connected to Google Sheets.");
    scheduleRender();
  }).catch(err=>{
    // Requirement: keep working in Local mode until Google Sheets access is available.
    // The saved URL is deliberately NOT cleared here (see persistPrefs) so the next visit,
    // or a manual click of "Sync now"/"Connect", can retry without re-pasting anything.
    state.dataMode = "local";
    _activeGoogleService = null;
    persistPrefs();
    state.sync.status = auto ? "offline" : "error";
    state.sync.error = err.message || String(err);
    showToast(auto
      ? "Couldn't reconnect to Google Sheets automatically — working from local data. Go to Settings → Data Source to retry."
      : "Couldn't connect to Google Sheets — staying in Local mode.");
    scheduleRender();
  });
}
function disconnectGoogleSheet(){
  const svc = _activeGoogleService || googleSheetsDataServiceInstance;
  Promise.resolve(svc.disconnect ? svc.disconnect() : null).then(()=>{
    _activeGoogleService = null;
    setDataMode("local");
  });
}
function syncNow(){
  if(state.dataMode!=="google"){
    if(state.dataMode==="local") persistData();
    state.sync.status = state.dataMode==="local" ? (STORAGE_AVAILABLE ? "synced" : "offline") : "offline";
    state.sync.lastSyncedAt = new Date().toISOString();
    showToast("Up to date.");
    scheduleRender();
    return;
  }
  const svc = getActiveDataService();
  state.sync.status = "syncing"; state.sync.error = null;
  scheduleRender();
  svc.syncFromGoogleSheets().then(result=>{
    if(result && result.conflict){
      state.sync.status = "connected";
      scheduleRender();
      showSyncConflict(result.items, result.actions);
      return;
    }
    state.items = result.items; state.actions = result.actions;
    resyncIdCounters(state.items, state.actions);
    state.sync.status = "connected"; state.sync.lastSyncedAt = new Date().toISOString(); state.sync.error = null;
    showToast("Synced with Google Sheets.");
    scheduleRender();
  }).catch(err=>{
    state.sync.status = "error"; state.sync.error = err.message || String(err);
    scheduleRender();
  });
}
/* ---- sync conflict UI state ---- */
function showSyncConflict(remoteItems, remoteActions){
  state.ui.conflict = {
    message: "Google Sheet has changed since the last sync.",
    remoteItems, remoteActions,
    localItems: deepClone(state.items), localActions: deepClone(state.actions),
    diffSummary: null,
  };
  scheduleRender();
}
function closeConflictModal(){ state.ui.conflict = null; scheduleRender(); }
function diffSnapshots(localItems, remoteItems){
  const localIds = new Set(localItems.map(i=>i.id));
  const remoteIds = new Set(remoteItems.map(i=>i.id));
  const added = remoteItems.filter(i=>!localIds.has(i.id)).length;
  const removed = localItems.filter(i=>!remoteIds.has(i.id)).length;
  let changed = 0;
  remoteItems.forEach(r=>{
    const l = localItems.find(i=>i.id===r.id);
    if(l && JSON.stringify(l)!==JSON.stringify(r)) changed++;
  });
  return { added, removed, changed };
}
function resolveConflict(choice){
  const c = state.ui.conflict; if(!c) return;
  if(choice==="review"){ c.diffSummary = diffSnapshots(c.localItems, c.remoteItems); scheduleRender(); return; }
  if(choice==="reload"){
    state.items = c.remoteItems; state.actions = c.remoteActions;
    resyncIdCounters(state.items, state.actions);
    state.sync.status = "connected"; state.sync.lastSyncedAt = new Date().toISOString(); state.sync.error = null;
    showToast("Reloaded from Google Sheet.");
  }
  if(choice==="keep-local"){
    state.sync.status = "connected"; state.sync.error = null;
    showToast("Kept your local changes. Sync again to try pushing them.");
  }
  state.ui.conflict = null;
  scheduleRender();
}

function persistData(){

function esc(s){

function uniqueSorted(arr){ return Array.from(new Set(arr.filter(Boolean))).sort((a,b)=>a.localeCompare(b)); }

function baseItemsForNav(){
  const t = NAV_TYPE_MAP[state.ui.nav];

function getFilteredSortedItems(){
  const { search, filters, sort } = state.ui;
  let items = baseItemsForNav();
  const q = search.trim().toLowerCase();
  if(q){
    items = items.filter(it=>{
      return [it.id, it.title, it.description, it.owner, it.project, it.workstream, it.action, it.type, it.status, it.priority, it.riskLevel]
        .some(f => (f||"").toLowerCase().includes(q));
    });
  }
  if(filters.type) items = items.filter(it=>it.type===filters.type);
  if(filters.status) items = items.filter(it=>it.status===filters.status);
  if(filters.priority) items = items.filter(it=>it.priority===filters.priority);
  if(filters.owner) items = items.filter(it=>it.owner===filters.owner);
  if(filters.project) items = items.filter(it=>it.project===filters.project);
  if(filters.workstream) items = items.filter(it=>it.workstream===filters.workstream);
  if(filters.riskLevel) items = items.filter(it=>it.riskLevel===filters.riskLevel);
  if(filters.probability) items = items.filter(it=>it.probability===Number(filters.probability));
  if(filters.impact) items = items.filter(it=>it.impact===Number(filters.impact));
  if(filters.overdue) items = items.filter(it=>dueTiming(it.dueDate, it.status)==="overdue");
  if(filters.dueRange) items = items.filter(it=>inDueRange(it.dueDate, isOpenStatus(it.status), filters.dueRange));

  const dir = sort.dir==="asc" ? 1 : -1;
  items = items.slice().sort((a,b)=>{
    let av = a[sort.field], bv = b[sort.field];
    if(sort.field==="dueDate" || sort.field==="dateRaised" || sort.field==="reviewDate"){
      av = av || "9999-99-99"; bv = bv || "9999-99-99";
    }
    if(sort.field==="riskScore"){ av = av==null?-1:av; bv = bv==null?-1:bv; }
    if(typeof av === "string") av = av.toLowerCase();
    if(typeof bv === "string") bv = bv.toLowerCase();
    if(av < bv) return -1*dir;
    if(av > bv) return 1*dir;
    return a.id.localeCompare(b.id);
  });
  return items;
}

/* ---------- dashboard computations (single source of truth: state.items) ---------- */
function computeDashboardMetrics(){
  const items = state.items;
  const openRisks = items.filter(it=>it.type==="Risk" && isOpenStatus(it.status));
  const criticalRisks = openRisks.filter(it=>it.riskLevel==="Critical");
  const openIssues = items.filter(it=>it.type==="Issue" && isOpenStatus(it.status));
  const openDeps = items.filter(it=>it.type==="Dependency" && isOpenStatus(it.status));
  const openAsm = items.filter(it=>it.type==="Assumption" && isOpenStatus(it.status));

  const overdueActions = state.actions.filter(isActionOverdue);
  const dueSoonItems = items.filter(it=>isOpenStatus(it.status) && dueTiming(it.dueDate, it.status)==="soon");

  return {
    total: items.length,
    openRisks: openRisks.length,
    criticalRisks: criticalRisks.length,
    openIssues: openIssues.length,
    openDeps: openDeps.length,
    openAsm: openAsm.length,
    overdueActions: overdueActions.length,
    dueSoon: dueSoonItems.length,
  };
}

/* ---------- Actions engine ---------- */
function computeActionMetrics(){
  const actions = state.actions;
  const open = actions.filter(a=>a.status!=="Complete");
  const overdue = actions.filter(isActionOverdue);
  const dueSoon = actions.filter(a=>actionDueTiming(a)==="soon");
  const completed = actions.filter(a=>a.status==="Complete");
  const completionRate = actions.length ? Math.round((completed.length/actions.length)*100) : 0;
  return {
    total: actions.length,
    open: open.length,
    overdue: overdue.length,
    dueSoon: dueSoon.length,
    completed: completed.length,
    completionRate,
  };
}
function getFilteredSortedActions(){
  const { actionsSearch, actionsFilters, actionsSort } = state.ui;
  let actions = state.actions.slice();
  const q = (actionsSearch||"").trim().toLowerCase();
  if(q){
    actions = actions.filter(a=>{
      const related = findItem(a.relatedItem);
      return [a.id, a.description, a.owner, a.relatedItem, related?related.title:"", a.status, a.priority]
        .some(f=>(f||"").toLowerCase().includes(q));

  if(actionsFilters.status) actions = actions.filter(a=>a.status===actionsFilters.status);

  if(actionsFilters.owner) actions = actions.filter(a=>a.owner===actionsFilters.owner);
  if(actionsFilters.relatedType) actions = actions.filter(a=>{ const rel = findItem(a.relatedItem); return rel && rel.type===actionsFilters.relatedType; });
  if(actionsFilters.overdue) actions = actions.filter(a=>isActionOverdue(a));
  if(actionsFilters.dueRange) actions = actions.filter(a=>inDueRange(a.dueDate, a.status!=="Complete", actionsFilters.dueRange));

  const dir = actionsSort.dir==="asc" ? 1 : -1;
  actions.sort((a,b)=>{

    if(typeof bv === "string") bv = bv.toLowerCase();
    if(av<bv) return -1*dir;
    if(av>bv) return 1*dir;
    return a.id.localeCompare(b.id);

/* 5x5 probability x impact matrix - counts every risk into its cell.
   Row = probability (5 at top, 1 at bottom), column = impact (1..5). */
function computeRiskMatrix(onlyOpen){
  const risks = state.items.filter(it=>it.type==="Risk" && (!onlyOpen || isOpenStatus(it.status)));
  const grid = [];
  for(let p=5; p>=1; p--){
    const row = [];
    for(let i=1; i<=5; i++){
      const score = riskScore(p,i);
      const level = riskLevel(score);
      const items = risks.filter(r=>r.probability===p && r.impact===i);
      row.push({ probability:p, impact:i, score, level, count: items.length, items });
    }
    grid.push(row);
  }
  return grid;
}
function computeTopRisks(limit){
  return state.items
    .filter(it=>it.type==="Risk" && isOpenStatus(it.status))
    .slice()
    .sort((a,b)=> b.riskScore - a.riskScore || a.id.localeCompare(b.id))
    .slice(0, limit||5);
}

/* ---------- small chart builders ---------- */
function donutSVG(segments, size, strokeWidth){
  size = size||130; strokeWidth = strokeWidth||20;
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  const r = (size - strokeWidth)/2, cx=size/2, cy=size/2, circ = 2*Math.PI*r;
  let offset = 0, arcs = "";
  segments.forEach(seg=>{
    if(seg.value<=0) return;
    const dash = (seg.value/total)*circ;
    arcs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${strokeWidth}" stroke-dasharray="${dash.toFixed(2)} ${(circ-dash).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"></circle>`;
    offset += dash;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="RAID distribution donut chart">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${strokeWidth}"></circle>
    ${arcs}
    <text x="${cx}" y="${cy-2}" text-anchor="middle" font-family="Libre Franklin, sans-serif" font-weight="700" font-size="24" fill="var(--text-primary)">${total}</text>
    <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="10.5" fill="var(--text-muted)">RAID items</text>
  </svg>`;
}
function barRows(segments, maxTrackWidth){
  if(!segments.length) return `<p style="font-size:12.5px; color:var(--text-muted); padding:6px 0;">No data yet.</p>`;
  const max = Math.max(1, ...segments.map(s=>s.value));
  return segments.map(s=>`
    <div class="bar-row">
      <span class="bar-label" title="${esc(s.label)}">${esc(s.label)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${(s.value/max*100).toFixed(1)}%; background:${s.color||'var(--accent)'};"></span></span>
      <span class="bar-val tabular">${s.value}</span>
    </div>`).join("");
}
function legendRow(segments){
  return `<div class="legend">${segments.map(s=>`<span class="legend-item"><span class="legend-swatch" style="background:${s.color}"></span>${esc(s.label)} · ${s.value}</span>`).join("")}</div>`;
}

/* Probability x Impact heatmap - the classic risk-matrix visual. Each cell is
   colored by the SAME riskLevel() band function used everywhere else, and
   shows its score plus how many current risks fall in it. Clicking a
   populated cell filters the Risks register to exactly that combination. */
function riskMatrixHTML(grid, opts){
  opts = opts || {};
  const clickable = opts.clickable !== false;
  const impactHeads = [1,2,3,4,5].map(i=>`<th>${i}<br><span class="rm-axis-label">${SCALE_LABELS[i]}</span></th>`).join("");
  const rows = grid.map(row=>{
    const p = row[0].probability;
    return `<tr><th class="rm-row-head">${p}<br><span class="rm-axis-label">${SCALE_LABELS[p]}</span></th>${row.map(cell=>{
      const bg = `color-mix(in srgb, ${SEV_COLOR[cell.level]} ${cell.count>0 ? 30:12}%, var(--surface))`;
      const action = clickable && cell.count>0 ? `data-action="matrix-cell" data-probability="${cell.probability}" data-impact="${cell.impact}"` : "";
      return `<td class="rm-cell ${cell.count>0?'has-items':''}" style="background:${bg};" ${action} title="Probability ${cell.probability} × Impact ${cell.impact} = ${cell.score} (${cell.level})">
        <div class="rm-score">${cell.score}</div>
        ${cell.count>0 ? `<div class="rm-count">${cell.count} risk${cell.count>1?'s':''}</div>` : ""}
      </td>`;
    }).join("")}</tr>`;
  }).join("");

  return `
  <div class="risk-matrix-wrap">
    <table class="risk-matrix">
      <thead><tr><th class="rm-corner"><span>Probability ↑</span><span class="rm-corner-sub">Impact →</span></th>${impactHeads}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

  opts = opts||{};

        </div>
      </div>
      <div class="panel chart-card">
        <h3>Risk severity distribution</h3>
        <span class="chart-hint">Risk register only, by probability × impact level</span>
        ${barRows(sevDist)}
      </div>
    </div>
    <div class="grid-2" style="margin-bottom:16px; align-items:stretch;">
      <div class="panel chart-card">
        <h3>Risk matrix</h3>
        <span class="chart-hint">Open risks by probability × impact — score and level, live from the risk-scoring engine</span>
        ${riskMatrixHTML(matrix)}
        ${riskBandLegend()}
      </div>
      <div class="panel chart-card">
        <h3>Top risks by score</h3>
        <span class="chart-hint">Highest probability × impact, open risks only</span>
        <div class="due-list">${topRisksRows}</div>
      </div>
    </div>
    <div class="grid-2">
      <div class="panel chart-card">
        <h3>Status distribution</h3>
        <span class="chart-hint">All RAID items, across every status</span>
        ${barRows(statusDist.map(s=>({...s, color:"var(--accent)"})))}
      </div>
      <div class="panel chart-card">
        <h3>Items by owner</h3>
        <span class="chart-hint">Top owners by number of assigned RAID items</span>
        ${barRows(ownerDist.map(o=>({...o, color:"var(--action)"})))}
      </div>
    </div>
    <div class="panel chart-card" style="margin-top:16px;">
      <div class="section-head" style="margin-bottom:2px;">
        <h3 style="font-size:15px;">Actions</h3>
        <span class="hint"><button class="btn btn-ghost btn-sm" data-action="nav" data-nav="actions" style="padding:2px 8px;">Open Actions page →</button></span>
      </div>

function validateActionForm(f){

function saveActionForm(){

  const nowISO = todayISO();
  f.completionPct = Math.max(0, Math.min(100, Number(f.completionPct)||0));
  // completion tracking: keep status and % in sync at the 100 / "Complete" boundary
  if(f.completionPct===100) f.status = "Complete";
  if(f.status==="Complete") f.completionPct = 100;

  const svc = getActiveDataService();
  const isAdd = state.ui.actionModal.mode==="add";
  let task;
  if(isAdd){
    f.id = nextActionId();
