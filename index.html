    f.history = [{ date:nowISO, note:`Action logged against ${f.relatedItem} by ${f.owner}.` }];
    task = svc.createAction(f);
  } else {
    const prev = findAction(state.ui.actionModal.id);
    f.id = prev.id; f.createdDate = prev.createdDate;
    f.lastUpdated = nowISO;
    f.history = (prev.history||[]).concat([{ date:nowISO, note:"Action updated." }]);
    task = svc.updateAction(f.id, f);
  }
  task.then(()=> refreshFromService()).then(()=>{
    showToast(`${f.id} ${isAdd?"created":"updated"}.`);
    closeActionModal();

    showToast(err.message || "Couldn't save that action — please try again.");

function fmtDateTime(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  if(isNaN(d)) return "—";
  return d.toLocaleString(undefined, { year:"numeric", month:"short", day:"numeric", hour:"numeric", minute:"2-digit" });
}

    "reset-demo", null, "Reset data"
  );
}
function csvEscape(v){
  const s = v==null ? "" : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function toCSV(rows, cols){
  const lines = [cols.map(csvEscape).join(",")];
  rows.forEach(r=>{ lines.push(cols.map(c=>csvEscape(r[c])).join(",")); });
  return lines.join("\r\n");
}

    return { kind, label:`Full backup — ${state.items.length} RAID items, ${state.actions.length} actions`, filename:"raid-log-tracker-backup.json", content: JSON.stringify(payload, null, 2) };
  }
  if(kind==="items-csv"){
    return { kind, label:`RAID Register — ${state.items.length} rows`, filename:"raid-register.csv", content: toCSV(state.items, ITEM_CSV_COLUMNS) };
  }
  if(kind==="actions-csv"){
    return { kind, label:`Actions — ${state.actions.length} rows`, filename:"actions.csv", content: toCSV(state.actions, ACTION_CSV_COLUMNS) };
  }
  return null;
}

function validateForm(f){
  const errs = {};
  if(!f.title || !f.title.trim()) errs.title = "Title is required.";
  if(!f.project) errs.project = "Project is required.";
  if(!f.workstream) errs.workstream = "Workstream is required.";
  if(!f.owner || !f.owner.trim()) errs.owner = "Owner is required.";
  if(!f.status) errs.status = "Status is required.";
  if(!f.dateRaised) errs.dateRaised = "Date raised is required.";
  if(!f.dueDate) errs.dueDate = "Due date is required.";
  if(f.type==="Risk"){
    if(!f.probability) errs.probability = "Probability is required for risks.";
    if(!f.impact) errs.impact = "Impact is required for risks.";
  }
  if(f.dueDate && f.dateRaised && f.dueDate < f.dateRaised){
    errs.dueDate = "Due date can't be before the date raised.";
  }
  if(f.reviewDate && f.dateRaised && f.reviewDate < f.dateRaised){
    errs.reviewDate = "Review date can't be before the date raised.";
  }
  if(f.actionDueDate && f.dateRaised && f.actionDueDate < f.dateRaised){
    errs.actionDueDate = "Action due date can't be before the date raised.";
  }
  return errs;
}

function saveForm(){
  const f = state.ui.formData;
  const errs = validateForm(f);
  state.ui.formErrors = errs;
  if(Object.keys(errs).length){ scheduleRender(); return; }

  const nowISO = todayISO();
  if(f.type==="Risk"){
    f.probability = Number(f.probability); f.impact = Number(f.impact);
    f.riskScore = riskScore(f.probability, f.impact);
    f.riskLevel = riskLevel(f.riskScore);
    f.priority = f.riskLevel;
  } else {
    f.probability = null; f.impact = null; f.riskScore = null; f.riskLevel = null;
  }
  f.actionCompletion = Number(f.actionCompletion)||0;

  const svc = getActiveDataService();
  const isAdd = state.ui.modal.mode==="add";
  let task;
  if(isAdd){
    f.id = nextId(f.type);
    f.createdDate = nowISO; f.lastUpdated = nowISO;
    f.history = [{ date:nowISO, note:`${f.type} logged by ${f.owner}.` }];
    task = svc.createRaidItem(f);
  } else {
    const prev = findItem(state.ui.modal.id);
    f.id = prev.id; f.createdDate = prev.createdDate;
    f.lastUpdated = nowISO;
    f.history = (prev.history||[]).concat([{ date:nowISO, note:"Item updated." }]);
    task = svc.updateRaidItem(f.id, f);
  }
  task.then(()=> refreshFromService()).then(()=>{
    showToast(`${f.id} ${isAdd?"created":"updated"}.`);
    closeModal();
  }).catch(err=>{
    showToast(err.message || "Couldn't save that item — please try again.");
    scheduleRender();
  });
}

function fieldWrap(id, label, required, errorMsg, innerHTML, spanTwo, hint){
  return `<div class="form-field ${spanTwo?"span-2":""} ${errorMsg?"error":""}">
    <label for="${id}">${esc(label)} ${required?'<span class="req">*</span>':""}</label>
    ${innerHTML}
    ${hint ? `<span class="field-hint">${hint}</span>` : ""}
    ${errorMsg ? `<span class="field-error">${esc(errorMsg)}</span>` : ""}
  </div>`;
}
function selectHTML(id, field, options, value, attrName){
  attrName = attrName || "formfield";
  return `<select id="${id}" data-${attrName}="${field}">${options.map(o=>{
    const v = typeof o==="object" ? o.value : o;
    const l = typeof o==="object" ? o.label : o;
    return `<option value="${esc(v)}" ${String(value)===String(v)?"selected":""}>${esc(l)}</option>`;
  }).join("")}</select>`;
}

}

  const c = state.ui.conflict;
  root.innerHTML += `
  <div class="overlay" data-action="overlay-close-conflict">
    <div class="modal confirm-box" role="alertdialog" aria-modal="true">
      <div class="modal-head"><h2>Sync conflict</h2><button class="icon-btn" data-action="close-conflict" aria-label="Close">✕</button></div>
      <div class="modal-body">
        <p style="margin:0 0 12px;"><strong>${esc(c.message)}</strong></p>
        <p style="font-size:12.5px; color:var(--text-muted); margin:0;">Someone (or something) changed the Google Sheet since this app last synced. Choose how to proceed rather than silently overwriting either side.</p>
        ${c.diffSummary ? `
        <div style="margin-top:12px; padding-top:12px; border-top:1px solid var(--border); font-size:12.5px; display:flex; flex-direction:column; gap:4px;">
          <span>${c.diffSummary.added} item(s) added on the sheet</span>

          <span>${c.diffSummary.changed} item(s) changed on both sides</span>
        </div>` : ""}

      <div class="modal-foot" style="flex-wrap:wrap;">
        <button class="btn btn-ghost" data-action="conflict-review" style="margin-right:auto;">Review differences</button>
        <button class="btn" data-action="conflict-keep-local">Keep local changes</button>
        <button class="btn btn-primary" data-action="conflict-reload">Reload from Google Sheet</button>

}

function requestDelete(id){
  const it = findItem(id); if(!it) return;
  const linkedCount = state.actions.filter(a=>a.relatedItem===id).length;
  const linkedNote = linkedCount
    ? ` <strong>${linkedCount}</strong> action${linkedCount===1?"":"s"} in the Actions register ${linkedCount===1?"is":"are"} linked to it and will be left unlinked, not deleted.`
    : "";
  askConfirm("Delete this item?", `Are you sure you want to delete <strong>${esc(it.id)} — ${esc(it.title)}</strong>?${linkedNote} This action cannot be undone.`, "delete", id);
}
function performConfirm(){
  const c = state.ui.confirm; if(!c) return;
  const svc = getActiveDataService();

  if(c.onConfirmName==="delete"){
    svc.deleteRaidItem(c.payload).then(removed=>refreshFromService().then(()=>{
      if(removed) showToast(`${removed.id} deleted.`);
      if(state.ui.detailId===c.payload) state.ui.detailId = null;
      if(state.ui.modal && state.ui.modal.id===c.payload) closeModal();
    })).catch(err=> showToast(err.message || "Couldn't delete that item.")).finally(()=>{
      state.ui.confirm = null; scheduleRender();
    });
    return;
  }
  if(c.onConfirmName==="delete-action"){
    svc.deleteAction(c.payload).then(removed=>refreshFromService().then(()=>{
      if(removed) showToast(`${removed.id} deleted.`);
      if(state.ui.actionModal && state.ui.actionModal.id===c.payload) closeActionModal();
    })).catch(err=> showToast(err.message || "Couldn't delete that action.")).finally(()=>{
      state.ui.confirm = null; scheduleRender();
    });
    return;
  }
  if(c.onConfirmName==="reset-demo"){
    // Resetting always lands back in Local mode with the baked-in demo
    // dataset, regardless of which data source was active beforehand.
    state.dataMode = "local"; _activeGoogleService = null; persistPrefs();
    localDataServiceInstance.resetToDemo().then(()=>refreshFromService()).then(()=>{
      state.ui.detailId = null; state.ui.modal = null; state.ui.actionModal = null;
      state.ui.search = ""; state.ui.filters = defaultFilters();
      state.ui.actionsSearch = ""; state.ui.actionsFilters = defaultActionFilters();
      state.sync.status = STORAGE_AVAILABLE ? "synced" : "offline"; state.sync.lastSyncedAt = new Date().toISOString(); state.sync.error = null;
      showToast("Demo data restored.");
    }).finally(()=>{ state.ui.confirm = null; scheduleRender(); });
    return;
  }
  if(c.onConfirmName==="import-data"){
    const data = c.payload;
    state.dataMode = "local"; _activeGoogleService = null; persistPrefs();
    localDataServiceInstance.replaceAll(data.items, data.actions).then(()=>refreshFromService()).then(()=>{
      state.ui.detailId = null; state.ui.modal = null; state.ui.actionModal = null;
      state.ui.search = ""; state.ui.filters = defaultFilters();
      state.ui.actionsSearch = ""; state.ui.actionsFilters = defaultActionFilters();
      state.ui.importPreview = null; state.ui.importError = null;
      state.sync.status = STORAGE_AVAILABLE ? "synced" : "offline"; state.sync.lastSyncedAt = new Date().toISOString(); state.sync.error = null;
      showToast(`Imported ${state.items.length} RAID item${state.items.length===1?"":"s"} and ${state.actions.length} action${state.actions.length===1?"":"s"}.`);
    }).finally(()=>{ state.ui.confirm = null; scheduleRender(); });
    return;
  }
  if(c.onConfirmName==="discard-modal"){
    closeModal();
  }
  if(c.onConfirmName==="discard-action-modal"){
    closeActionModal();
  }
  state.ui.confirm = null;
  scheduleRender();
}

function renderToast(){

}

/* ---------- FULL RENDER ---------- */
function fullRender(){
  const app = document.getElementById("app");
  app.innerHTML = `
    ${renderSidebar()}
    <div class="main">
      ${renderTopbar()}
      <div class="content"><div id="view-root"></div></div>
    </div>`;
  renderView();
  document.getElementById("overlay-root").innerHTML = "";
  renderModal();
  renderActionModal();
  renderDetail();
  renderConfirm();
  renderConflictModal();
  renderToast();
}

function scheduleRender(){
  const scrollSelectors = [".modal-body",".drawer-body",".table-wrap"];
  const scrolls = scrollSelectors.map(sel=>{ const el=document.querySelector(sel); return el ? [sel, el.scrollTop] : null; }).filter(Boolean);
  const active = document.activeElement;
  let focusId=null, selStart=null, selEnd=null;
  if(active && active.id){
    focusId = active.id;
    if("selectionStart" in active){ try{ selStart=active.selectionStart; selEnd=active.selectionEnd; }catch(e){} }
  }
  fullRender();
  scrolls.forEach(([sel,top])=>{ const el=document.querySelector(sel); if(el) el.scrollTop = top; });
  if(focusId){
    const el = document.getElementById(focusId);
    if(el){
      el.focus();
      if(selStart!=null && "setSelectionRange" in el){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

/* ---------- EVENT DELEGATION ---------- */
document.addEventListener("click", (e)=>{
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action;

  if(action==="nav"){
    state.ui.nav = el.dataset.nav;
    state.ui.search = ""; state.ui.filters = defaultFilters();
    state.ui.sidebarOpen = false;
    scheduleRender(); return;
  }
  if(action==="toggle-sidebar"){ state.ui.sidebarOpen = !state.ui.sidebarOpen; scheduleRender(); return; }
  if(action==="open-add"){ openAddModal(); return; }
  if(action==="edit-item"){ e.stopPropagation(); openEditModal(el.dataset.id); return; }
  if(action==="view-item"){ openDetail(el.dataset.id); return; }
  if(action==="delete-item"){ e.stopPropagation(); requestDelete(el.dataset.id); return; }
  if(action==="close-modal"){ requestCloseModal(); return; }
  if(action==="close-drawer"){ closeDetail(); return; }
  if(action==="overlay-close"){ if(e.target===el) requestCloseModal(); return; }
  if(action==="save-item"){ saveForm(); return; }
  if(action==="sort"){
    const field = el.closest("[data-field]")?.dataset.field || el.dataset.field;
    if(state.ui.sort.field===field){ state.ui.sort.dir = state.ui.sort.dir==="asc"?"desc":"asc"; }
    else { state.ui.sort.field = field; state.ui.sort.dir = "asc"; }
    scheduleRender(); return;
  }
  if(action==="toggle-chip"){
    const chip = el.dataset.chip;
    state.ui.filters[chip] = !state.ui.filters[chip];
    scheduleRender(); return;
  }
  if(action==="reset-filters"){
    state.ui.search = "";
    state.ui.filters = defaultFilters();
    scheduleRender(); return;
  }
  if(action==="remove-filter"){
    const key = el.dataset.key;
    if(key==="search") state.ui.search = "";
    else if(key==="matrix"){ state.ui.filters.probability = ""; state.ui.filters.impact = ""; }
    else if(key==="overdue") state.ui.filters.overdue = false;
    else state.ui.filters[key] = "";
    scheduleRender(); return;
  }
  if(action==="matrix-cell"){
    state.ui.nav = "risks";
    state.ui.search = "";
    state.ui.filters = Object.assign(defaultFilters(), { probability:el.dataset.probability, impact:el.dataset.impact });
    scheduleRender(); return;
  }
  if(action==="cancel-confirm"){ closeConfirm(); return; }
  if(action==="overlay-close-confirm"){ if(e.target===el) closeConfirm(); return; }
  if(action==="confirm-yes"){ performConfirm(); return; }

  /* ---- Actions module ---- */
  if(action==="open-add-action"){ openAddAction(); return; }
  if(action==="edit-action"){ e.stopPropagation(); openEditAction(el.dataset.id); return; }
  if(action==="delete-action"){ e.stopPropagation(); requestDeleteAction(el.dataset.id); return; }
  if(action==="close-action-modal"){ requestCloseActionModal(); return; }
  if(action==="overlay-close-action"){ if(e.target===el) requestCloseActionModal(); return; }
  if(action==="save-action"){ saveActionForm(); return; }
  if(action==="jump-to-related"){
    const rid = el.dataset.id;
    if(rid && findItem(rid)){ closeActionModal(); openDetail(rid); }
    else showToast("That RAID item no longer exists.");
    return;
  }
  if(action==="sort-actions"){
    const field = el.dataset.field;
    if(state.ui.actionsSort.field===field){ state.ui.actionsSort.dir = state.ui.actionsSort.dir==="asc"?"desc":"asc"; }
    else { state.ui.actionsSort.field = field; state.ui.actionsSort.dir = "asc"; }
    scheduleRender(); return;
  }
  if(action==="toggle-action-chip"){
    const chip = el.dataset.chip;
    state.ui.actionsFilters[chip] = !state.ui.actionsFilters[chip];
    scheduleRender(); return;
  }
  if(action==="reset-action-filters"){
    state.ui.actionsSearch = "";
    state.ui.actionsFilters = defaultActionFilters();
    scheduleRender(); return;
  }
  if(action==="remove-action-filter"){
    const key = el.dataset.key;
    if(key==="search") state.ui.actionsSearch = "";
    else if(key==="overdue") state.ui.actionsFilters.overdue = false;
    else state.ui.actionsFilters[key] = "";
    scheduleRender(); return;
  }

  /* ---- Settings: appearance, reset, export/import ---- */
  if(action==="set-theme"){
    const theme = el.dataset.theme;
    state.ui.theme = theme;
    applyTheme(theme);
    persistPrefs();
    scheduleRender(); return;
  }
  if(action==="reset-demo-request"){ requestResetDemo(); return; }
  if(action==="export"){
    state.ui.exportOutput = generateExport(el.dataset.kind);
    scheduleRender(); return;
  }
  if(action==="copy-export"){
    const out = state.ui.exportOutput; if(!out) return;
    const ta = document.getElementById("export-output-textarea");
    const done = ()=>showToast("Copied to clipboard.");
    const fallback = ()=>{
      if(ta){ ta.focus(); ta.select(); try{ if(document.execCommand("copy")){ done(); return; } }catch(err){} }
      showToast("Couldn't copy automatically — select the text and copy it manually.");
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(out.content).then(done).catch(fallback);
    } else fallback();
    return;
  }
  if(action==="trigger-import-file"){
    const input = document.getElementById("import-file-input");
    if(input) input.click();
    return;
  }
  if(action==="confirm-import"){
    const p = state.ui.importPreview; if(!p) return;
    const droppedNote = (p.droppedItems || p.droppedActions)
      ? ` ${p.droppedItems||0} invalid item(s) and ${p.droppedActions||0} invalid action(s) in that file will be skipped.`
      : "";
    askConfirm(
      "Replace all data with this import?",
      `This will replace <strong>${state.items.length} RAID item(s)</strong> and <strong>${state.actions.length} action(s)</strong> currently in your workspace with <strong>${p.items.length} item(s)</strong> and <strong>${p.actions.length} action(s)</strong> from “${esc(p.fileName)}”.${droppedNote} This cannot be undone.`,
      "import-data", { items:p.items, actions:p.actions }, "Replace data"
    );
    return;
  }
  if(action==="cancel-import-preview"){
    state.ui.importPreview = null; state.ui.importError = null;
    scheduleRender(); return;
  }

  /* ---- Settings: Data Source (data service / Google Sheets) ---- */
  if(action==="set-data-mode"){ setDataMode(el.dataset.mode); return; }
  if(action==="connect-google-sheet"){
    const input = document.getElementById("ds-sheet-url");
    connectGoogleSheet(input ? input.value.trim() : "");
    return;
  }
  if(action==="disconnect-google-sheet"){ disconnectGoogleSheet(); return; }
  if(action==="sync-now"){ e.stopPropagation(); syncNow(); return; }
  if(action==="open-data-source-settings"){ state.ui.nav = "settings"; state.ui.sidebarOpen = false; scheduleRender(); return; }
  if(action==="close-conflict"){ closeConflictModal(); return; }
  if(action==="overlay-close-conflict"){ if(e.target===el) closeConflictModal(); return; }
  if(action==="conflict-reload"){ resolveConflict("reload"); return; }
  if(action==="conflict-keep-local"){ resolveConflict("keep-local"); return; }
  if(action==="conflict-review"){ resolveConflict("review"); return; }
});

document.addEventListener("input", (e)=>{
  const t = e.target;
  if(t.id==="global-search-input"){
    // The topbar search box mirrors whichever list is showing: Actions on
    // the Actions page, the RAID register everywhere else it's shown.
    if(state.ui.nav==="actions") state.ui.actionsSearch = t.value;
    else state.ui.search = t.value;
    scheduleRender(); return;
  }
  if(t.id==="register-search-input"){
    state.ui.search = t.value;
    scheduleRender(); return;
  }
  if(t.id==="actions-search-input"){
    state.ui.actionsSearch = t.value;
    scheduleRender(); return;
  }
  if(t.dataset && t.dataset.actionfield){
    // No action-form field has UI that depends on another live, so plain
    // state mutation (no re-render) is always safe here — see the note by
    // the RAID form's "change" handler for why that matters on click safety.
    if(!state.ui.actionFormData) return;
    state.ui.actionFormData[t.dataset.actionfield] = t.value;
    state.ui.actionFormDirty = true;
    return;
  }
  if(t.dataset && t.dataset.formfield){
    const key = t.dataset.formfield;
    if(!state.ui.formData) return;
    if(key==="actionCompletion"){
      let v = Number(t.value); if(isNaN(v)) v = 0; v = Math.max(0, Math.min(100, v));
      state.ui.formData[key] = v;
    } else {
      state.ui.formData[key] = t.value;
    }
    state.ui.formDirty = true;
    // live-recompute risk preview / dependent options without disturbing typing
    if(key==="probability" || key==="impact" || key==="type" || key==="project"){
      scheduleRender();
    }
    return;
  }
});

document.addEventListener("change", (e)=>{
  const t = e.target;
  if(t.id==="import-file-input"){
    const file = t.files && t.files[0];
    t.value = ""; // allow re-selecting the same file name after a cancel/error
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      let parsed;
      try{ parsed = JSON.parse(String(reader.result)); }
      catch(err){ state.ui.importError = "That file isn't valid JSON."; state.ui.importPreview = null; scheduleRender(); return; }
      const result = validateAndNormalizeDataset(parsed);
      if(!result.ok){ state.ui.importError = result.reason; state.ui.importPreview = null; scheduleRender(); return; }
      state.ui.importError = null;
      state.ui.importPreview = { items:result.items, actions:result.actions, droppedItems:result.droppedItems, droppedActions:result.droppedActions, fileName:file.name };
      scheduleRender();
    };
    reader.onerror = ()=>{ state.ui.importError = "Couldn't read that file."; state.ui.importPreview = null; scheduleRender(); };
    reader.readAsText(file);
    return;
  }
  if(t.dataset && t.dataset.filter){
    const key = t.dataset.filter;
    state.ui.filters[key] = t.value;
    // Workstream is a sub-choice of Project — when the project changes, drop
    // a now-invalid workstream selection rather than silently showing zero
    // results for an impossible project+workstream combination.
    if(key==="project"){
      const valid = t.value ? (PROJECTS[t.value]||[]) : uniqueSorted(state.items.map(i=>i.workstream));
      if(state.ui.filters.workstream && !valid.includes(state.ui.filters.workstream)) state.ui.filters.workstream = "";
    }
    scheduleRender(); return;
  }
  if(t.dataset && t.dataset.actionFilter){
    state.ui.actionsFilters[t.dataset.actionFilter] = t.value;
    scheduleRender(); return;
  }
  if(t.dataset && t.dataset.actionfield){
    if(!state.ui.actionFormData) return;
    state.ui.actionFormData[t.dataset.actionfield] = t.value;
    state.ui.actionFormDirty = true;
    return; // no dependent UI to recompute — safe to skip re-render (see input handler note)
  }
  if(t.dataset && t.dataset.formfield){
    const key = t.dataset.formfield;
    if(!state.ui.formData) return;
    let v = t.value;
    if(key==="probability" || key==="impact") v = Number(v);
    state.ui.formData[key] = v;
    state.ui.formDirty = true;
    // Only fields whose CHANGE must be reflected elsewhere in the form trigger a re-render here.
    // Plain text/date/number fields are already captured via the "input" listener without
    // re-rendering, on purpose: re-rendering on a text field's blur-triggered "change" event can
    // detach the very element a subsequent click is targeting (mousedown blurs the field, firing
    // "change" mid-click, replacing the DOM before mouseup) — which silently swallows the click.
    let needsRerender = false;
    if(key==="type"){
      const newType = v;
      state.ui.formData.status = STATUS_BY_TYPE[newType][0];
      if(newType==="Risk"){
        state.ui.formData.probability = state.ui.formData.probability || 3;
        state.ui.formData.impact = state.ui.formData.impact || 3;
      }
      needsRerender = true;
    }
    if(key==="project"){
      state.ui.formData.workstream = PROJECTS[v][0];
      needsRerender = true;
    }
    if(key==="probability" || key==="impact") needsRerender = true;
    if(needsRerender) scheduleRender();
    return;
  }
});

document.addEventListener("keydown", (e)=>{
  if(e.key==="Escape"){
    if(state.ui.conflict){ closeConflictModal(); return; }
    if(state.ui.confirm){ closeConfirm(); return; }
    if(state.ui.detailId){ closeDetail(); return; }
    if(state.ui.modal){ requestCloseModal(); return; }
    if(state.ui.actionModal){ requestCloseActionModal(); return; }
  }
});

/* ---------- INIT ---------- */
fullRender();
// First-time visitor: seed storage immediately so the exact same records
// (with their original dates) are still there on the next refresh, rather
// than silently regenerating fresh demo data anchored to "today" every time.
if(boot.canPersist && boot.firstRun) persistData();
// Surface any boot-time notice (invalid/corrupt stored data, or storage
// being unavailable) only after everything above has finished initializing.
if(boot.notice) showToast(boot.notice);
// Auto-reconnect to Google Sheets: the page has already rendered with cached
// local data above, so there's something on screen immediately. If the user
// was last connected to a Sheet, silently retry that connection now and swap
// the data over live on success — or fall back to Local (already the state
// we booted into) with an explanatory toast if it fails, e.g. this copy is
// being viewed inside a sandboxed preview with no outbound network access.
if(initialPrefs.dataMode==="google" && initialPrefs.googleSheetUrl){
  connectGoogleSheet(initialPrefs.googleSheetUrl, { auto:true });
}
</script>
